org.gradle.caching=true
org.gradle.console=plain
org.gradle.daemon=true
# Groovy compilation of the large test tree exceeds the default 512m heap
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=false
org.gradle.warning.mode=all

# the version of our application. Grails can't seem to find it in build.gradle
version=0.9.9-SNAPSHOT

#
# Grails 7 (Apache) uses a single unified version for the framework, GORM,
# GSP, and all core plugins (cache, quartz-less core plugins, database
# migration, testing support, etc.). The grails-bom supplies versions for
# nearly everything else (Spring Boot 3.5.x, Spring 6.2.x, Groovy 4.0.x,
# hibernate-core-jakarta 5.6.15, Liquibase 4.27, Tomcat 10.1, ...).
#
grailsVersion=7.2.2

# asset-pipeline moved to cloud.wondrify; 5.0.12+ is the Grails 7 line
assetPipelineVersion=5.0.34

# the Grails quartz plugin is versioned separately from the monorepo
grailsQuartzVersion=4.0.1

# build-test-data moved to io.github.longwa; 6.x is the Grails 7 line
buildTestDataVersion=6.0.0

batikVersion=1.16
#
# Set this to 1.44 to work with Docker Engine 29 (Nov 2025).
# https://github.com/testcontainers/testcontainers-java/pull/11216
#
dockerApiVersion=1.44
docx4jVersion=8.3.8
flyingSaucerVersion=9.1.22
htmlUnitVersion=2.70.0
# use the version that Flying-Saucer-PDF was tested and released against
# https://github.com/flyingsaucerproject/flyingsaucer/blob/v9.1.22/flying-saucer-pdf/pom.xml
openPdfVersion=1.3.11
owaspVersion=7.4.4
poiVersion=3.17
sentryVersion=6.34.0
testContainersVersion=1.21.3
xDocReportVersion=2.0.4
mySqlConnectorVersion=8.0.22
