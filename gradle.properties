org.gradle.caching=true
org.gradle.console=plain
org.gradle.daemon=true
# Groovy compilation of the large test tree exceeds the default 512m heap
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.warning.mode=all

# the version of our application. Grails can't seem to find it in build.gradle
version=0.9.9-SNAPSHOT

# Groovy 3.0.23 ships with ASM 9.x; 9.7 fully supports Java 11-21 bytecode
asmVersion=9.7
# Grails 6 requires the 4.3+ line of the asset-pipeline plugin
assetPipelineVersion=4.5.2
batikVersion=1.16
#
# Set this to 1.44 to work with Docker Engine 29 (Nov 2025).
# https://github.com/testcontainers/testcontainers-java/pull/11216
#
dockerApiVersion=1.44
docx4jVersion=8.3.8
flyingSaucerVersion=9.1.22
gradleWrapperVersion=8.11.1
grailsVersion=6.2.3
# published to Maven Central (no longer to repo.grails.org)
grailsGradlePluginVersion=6.2.4
grailsViewsVersion=3.2.3
grailsWrapperVersion=1.0.0
# Grails 6.x remains on Groovy 3 (Groovy 4 arrives with Grails 7)
groovyVersion=3.0.23
htmlUnitVersion=2.70.0
httpComponentsVersion=4.5.14
httpCoreVersion=4.4.16
# Spring Boot 2.7 (Grails 6.2) manages Jackson 2.13.x
jacksonVersion=2.13.5
# grails-core pulls in 4.2.2 via directory-watcher. This breaks
# Macs, which need 5.8.0+, and testcontainers, which requests 5.13+.
# JNA's only breaking changes between 4.2.2 and today remove APIs
# that directory-watcher does not use.
# https://github.com/java-native-access/jna/blob/master/CHANGES.md#release-580
# https://github.com/java-native-access/jna/blob/master/CHANGES.md#breaking-changes
# https://github.com/java-native-access/jna/blob/master/CHANGES.md#breaking-changes-1
jnaVersion=5.13.0
# Grails's Spring Boot dependency doesn't play well with Logback 1.3+
logbackVersion=1.2.13
# Spring Boot 2.7 embeds Tomcat 9.0.x; 9.0.98 is the release Grails 6.2.3 ships
tomcatVersion=9.0.98
# use the version that Flying-Saucer-PDF was tested and released against
# https://github.com/flyingsaucerproject/flyingsaucer/blob/v9.1.22/flying-saucer-pdf/pom.xml
openPdfVersion=1.3.11
owaspVersion=7.4.4
poiVersion=3.17
seleniumVersion=3.141.59
sentryVersion=6.34.0
# Spring Boot 2.x / Tomcat 9 implement the Servlet 4.0 API
servletVersion=4.0.1
slf4jProvidedLog4j2Version=2.19.0
slf4jVersion=1.7.36
# Spring 5.3.x, per the Grails 6.2.3 BOM / Spring Boot 2.7 line (5.3.26+ adds
# official JDK 21 runtime support)
springframeworkVersion=5.3.39
spockVersion=2.3-groovy-3.0
springBootVersion=2.7.18
testContainersVersion=1.21.3
xDocReportVersion=2.0.4

#
# The following modules are tightly coupled. The grails-database-migration
# plugin documents the specific Liquibase version we need here:
#
# https://grails.github.io/grails-database-migration/latest/index.html
#
# GORM 8.1 (Grails 6) is still built against Hibernate 5.6.x.
#
# database-migration 5.0.x (the Grails 6 line) is still built against
# Liquibase 4.19.0, which computes v8 checksums, so existing
# DATABASECHANGELOG rows stay valid.
#
# N.B. the 8 in the mysql connector version refers to Java's release, not to
# MySQL's: this is the correct library to use to access MySql 5.7+ from Java 11.
#
databaseMigrationVersion=5.0.0
gormVersion=8.1.2
# the hibernate5 GORM plugin is versioned separately from gorm-core in Grails 6
gormHibernate5Version=8.1.1
hibernateVersion=5.6.15.Final
liquibaseVersion=4.19.0
mySqlConnectorVersion=8.0.22
micronautVersion=3.10.4
micronautSpringVersion=4.5.1
