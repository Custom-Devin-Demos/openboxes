# For local development: runs ONLY the database in a container.
# Run the application itself on the host with `./gradlew bootRun`.
# See docs/migration/baseline-setup.md for the full local development setup.
services:
    db:
      image: mariadb:10
      container_name: openboxes-db
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
        MYSQL_DATABASE: openboxes
        MYSQL_USER: ${DATASOURCE_USERNAME:-openboxes}
        MYSQL_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
      ports:
        - 3306:3306
      volumes:
        - openboxes-dev-db:/var/lib/mysql
      healthcheck:
        test: mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
        timeout: 20s
        retries: 5

volumes:
    openboxes-dev-db:
