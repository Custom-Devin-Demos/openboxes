# API characterization (snapshot) verification.
#
# Manual (workflow_dispatch) only: booting the legacy Grails 3 app in CI
# requires a full Gradle/Grails build plus Liquibase migrations against a
# fresh MariaDB (~15-25 minutes before the first request), which is
# prohibitive as a per-PR check. Run this manually before/after each
# migration milestone. See docs/migration/characterization-api.md.
name: API Snapshots

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openboxes
          MYSQL_USER: openboxes
          MYSQL_PASSWORD: openboxes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure application
        run: |
          mkdir -p ~/.grails
          cat > ~/.grails/openboxes-config.properties <<'EOF'
          dataSource.url=jdbc:mysql://localhost:3306/openboxes?useSSL=false&allowPublicKeyRetrieval=true
          dataSource.username=openboxes
          dataSource.password=openboxes
          EOF

      - name: Start application (runs Liquibase migrations)
        run: |
          ./gradlew bootRun > bootrun.log 2>&1 &
          echo $! > bootrun.pid
          # Wait up to 40 minutes for the app to answer.
          for i in $(seq 1 240); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/openboxes/ || true)
            if [ "$code" != "000" ] && [ "$code" != "" ]; then
              echo "App is up (HTTP $code)"; break
            fi
            sleep 10
          done
          tail -n 50 bootrun.log

      - name: Seed demo data and restart app
        run: |
          mysql -h127.0.0.1 -uopenboxes -popenboxes openboxes < docker/seed-demo-data.sql
          # Restart so caches reflect the seeded data.
          kill "$(cat bootrun.pid)" || true
          sleep 15
          ./gradlew bootRun > bootrun2.log 2>&1 &
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/openboxes/ || true)
            if [ "$code" != "000" ] && [ "$code" != "" ]; then
              echo "App is up (HTTP $code)"; break
            fi
            sleep 10
          done

      - name: Verify snapshots
        working-directory: api-snapshots
        run: npm run snapshots:verify

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootrun-logs
          path: bootrun*.log
