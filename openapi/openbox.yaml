openapi: 3.0.3
info:
  title: OpenBoxes REST API
  description: |
    OpenAPI specification for the OpenBoxes REST API (`/openboxes/api/**`).

    This root document is composed from per-domain path fragments listed under
    `x-fragments` (one line per fragment file). The bundler
    (`node src/bundle.js`) merges every fragment's paths and every schema file
    under `components/schemas/` into a single bundled document at
    `dist/openbox.bundled.json`, which is what lint and contract tests run
    against. See docs/migration/openapi-conventions.md.
  version: 0.1.0
  contact:
    name: OpenBoxes
    url: https://openboxes.com
servers:
  - url: /openboxes
    description: Application context root. All API paths below are relative to it (e.g. /openboxes/api/status).
security:
  - sessionCookie: []
tags:
  - name: admin
    description: Admin introspection, caches, upgrade and mail (AdminApiController)
  - name: app
    description: Authentication, session context and instance status (ApiController)
  - name: attributes
    description: Product/entity attributes (AttributeApiController)
  - name: categories
    description: Product categories (CategoryApiController)
  - name: dashboard
    description: Dashboard configuration and widget data (DashboardApiController)
  - name: eventTypes
    description: Event types (EventTypeApiController)
  - name: finance
    description: GL accounts, GL account types, budget codes, payment terms (GlAccountApiController, GlAccountTypeApiController, BudgetCodeApiController, PaymentTermApiController)
  - name: generic
    description: Generic domain CRUD/search by resource name (GenericApiController)
  - name: helpscout
    description: HelpScout Beacon widget configuration (HelpScoutApiController)
  - name: inventory
    description: Inventory, inventory levels, bin/internal locations, cycle counts, stock adjustments, record stock, stock card, transaction entries
  - name: invoice
    description: Invoicing (InvoiceApiController, PrepaymentInvoiceApiController, PrepaymentInvoiceItemApiController)
  - name: jobs
    description: Quartz job and scheduler management (JobApiController)
  - name: loadData
    description: Demo/configuration data loading (LoadDataApiController)
  - name: localization
    description: Translations / localized messages (LocalizationApiController)
  - name: locationGroups
    description: Location groups (LocationGroupApiController)
  - name: locationTypes
    description: Location types (LocationTypeApiController)
  - name: locations
    description: Locations (LocationApiController)
  - name: migration
    description: Data migration diagnostics (MigrationApiController)
  - name: noop
    description: Placeholder no-op REST resource (NoopApiController)
  - name: orders
    description: Orders, purchase orders, receiving, fulfillment, consumption, batch import, data exports and documents (Order/PurchaseOrder/OrderAdjustmentType/ReceiveOrder/PartialReceiving/Fulfillment/Consumption/Batch/DataExport/Document API controllers)
  - name: organizations
    description: Organizations (OrganizationApiController)
  - name: parties
    description: Parties, party roles and party types (PartyApiController, PartyRoleApiController, PartyTypeApiController)
  - name: persons
    description: Persons (PersonApiController)
  - name: preferenceTypes
    description: Preference types (PreferenceTypeApiController)
  - name: product
    description: Product API (ProductApiController)
  - name: productAssociation
    description: Product associations (ProductAssociationApiController)
  - name: productCatalog
    description: Product catalogs (ProductCatalogApiController)
  - name: productClassification
    description: Product classifications (ProductClassificationApiController)
  - name: productComponent
    description: Product components / BOM (ProductComponentApiController)
  - name: productGroup
    description: Product groups / families (ProductGroupApiController)
  - name: productPackage
    description: Product packages (ProductPackageApiController)
  - name: productScreen
    description: React product screen endpoints (ProductScreenApiController)
  - name: productSuppliers
    description: Product suppliers, their attributes and preferences (ProductSupplierApiController, ProductSupplierAttributeApiController, ProductSupplierPreferenceApiController)
  - name: productType
    description: Product types (ProductTypeApiController)
  - name: productsConfiguration
    description: Products configuration wizard (ProductsConfigurationApiController)
  - name: reasonCodes
    description: Reason codes (ReasonCodeApiController)
  - name: report
    description: Reports and KPI indicators (ReportApiController, IndicatorApiController)
  - name: roles
    description: Roles (RoleApiController)
  - name: selectOptions
    description: Dropdown option lists for the frontend (SelectOptionsApiController)
  - name: shipments
    description: Shipments, shipment items/workflows, create-shipment workflow, combined shipments, pack lists, delivery/receipt notes, putaways
  - name: stock-requisitions
    description: Stock movements, stock transfers, picklists, replenishments, requisitions, stocklists and mobile APIs (StockMovement/StockMovementItem/StockTransfer/Picklist/Replenishment/Requisition/RequisitionTemplate/Stocklist/StocklistItem/Mobile ApiControllers)
  - name: supplier
    description: Supplier search and details (SupplierApiController)
  - name: tags
    description: Product tags (TagApiController)
  - name: unitOfMeasure
    description: Units of measure and conversions (UnitOfMeasureApiController, UnitOfMeasureConversionApiController)
  - name: users
    description: Users (UserApiController)

# One line per per-domain fragment file under paths/. Sibling sessions add
# their fragment here (append a single line; keep the list alphabetized).
x-fragments:
  - paths/admin.yaml
  - paths/app.yaml
  - paths/attributes.yaml
  - paths/categories.yaml
  - paths/dashboard.yaml
  - paths/event-types.yaml
  - paths/finance.yaml
  - paths/generic.yaml
  - paths/helpscout.yaml
  - paths/inventory.yaml
  - paths/invoice.yaml
  - paths/jobs.yaml
  - paths/load-data.yaml
  - paths/localization.yaml
  - paths/location-groups.yaml
  - paths/location-types.yaml
  - paths/locations.yaml
  - paths/migration.yaml
  - paths/noop.yaml
  - paths/orders.yaml
  - paths/organizations.yaml
  - paths/parties.yaml
  - paths/persons.yaml
  - paths/preference-types.yaml
  - paths/product-associations.yaml
  - paths/product-catalogs.yaml
  - paths/product-classifications.yaml
  - paths/product-components.yaml
  - paths/product-groups.yaml
  - paths/product-packages.yaml
  - paths/product-screens.yaml
  - paths/product-suppliers.yaml
  - paths/product-types.yaml
  - paths/products-configuration.yaml
  - paths/products.yaml
  - paths/reason-codes.yaml
  - paths/report.yaml
  - paths/roles.yaml
  - paths/select-options.yaml
  - paths/shipments.yaml
  - paths/stock-requisitions.yaml
  - paths/supplier.yaml
  - paths/tags.yaml
  - paths/unit-of-measure.yaml
  - paths/users.yaml

paths: {}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        Grails session cookie. Obtain by POSTing
        `{"username": "...", "password": "...", "location": "<locationId>"}`
        to `/openboxes/api/login`; the JSESSIONID Set-Cookie from that response
        authenticates all subsequent requests. Choose the acting facility with
        `GET /openboxes/api/chooseLocation/{locationId}` if not set at login.
