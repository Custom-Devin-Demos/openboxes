openapi: 3.0.3
info:
  title: OpenBoxes REST API
  description: |
    OpenAPI specification for the OpenBoxes REST API (`/openboxes/api/**`).

    This root document is composed from per-domain path fragments listed under
    `x-fragments` (one line per fragment file). The bundler
    (`node src/bundle.js`) merges every fragment's paths and every schema file
    under `components/schemas/` into a single bundled document at
    `dist/openbox.bundled.json`, which is what lint and contract tests run
    against. See docs/migration/openapi-conventions.md.
  version: 0.1.0
  contact:
    name: OpenBoxes
    url: https://openboxes.com
servers:
  - url: /openboxes
    description: Application context root. All API paths below are relative to it (e.g. /openboxes/api/status).
security:
  - sessionCookie: []
tags:
  - name: attributes
    description: Product/entity attributes (AttributeApiController)
  - name: categories
    description: Product categories (CategoryApiController)
  - name: dashboard
    description: Dashboard configuration and widget data (DashboardApiController)
  - name: finance
    description: GL accounts, GL account types, budget codes, payment terms (GlAccountApiController, GlAccountTypeApiController, BudgetCodeApiController, PaymentTermApiController)
  - name: invoice
    description: Invoicing (InvoiceApiController, PrepaymentInvoiceApiController, PrepaymentInvoiceItemApiController)
  - name: localization
    description: Translations / localized messages (LocalizationApiController)
  - name: preferenceTypes
    description: Preference types (PreferenceTypeApiController)
  - name: productSuppliers
    description: Product suppliers, their attributes and preferences (ProductSupplierApiController, ProductSupplierAttributeApiController, ProductSupplierPreferenceApiController)
  - name: reasonCodes
    description: Reason codes (ReasonCodeApiController)
  - name: report
    description: Reports and KPI indicators (ReportApiController, IndicatorApiController)
  - name: shipments
    description: Shipments, shipment items/workflows, create-shipment workflow, combined shipments, pack lists, delivery/receipt notes, putaways
  - name: supplier
    description: Supplier search and details (SupplierApiController)
  - name: tags
    description: Product tags (TagApiController)
  - name: unitOfMeasure
    description: Units of measure and conversions (UnitOfMeasureApiController, UnitOfMeasureConversionApiController)

# One line per per-domain fragment file under paths/. Sibling sessions add
# their fragment here (append a single line; keep the list alphabetized).
x-fragments:
  - paths/attributes.yaml
  - paths/categories.yaml
  - paths/dashboard.yaml
  - paths/finance.yaml
  - paths/invoice.yaml
  - paths/localization.yaml
  - paths/preference-types.yaml
  - paths/product-suppliers.yaml
  - paths/reason-codes.yaml
  - paths/report.yaml
  - paths/shipments.yaml
  - paths/supplier.yaml
  - paths/tags.yaml
  - paths/unit-of-measure.yaml

paths: {}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        Grails session cookie. Obtain by POSTing
        `{"username": "...", "password": "...", "location": "<locationId>"}`
        to `/openboxes/api/login`; the JSESSIONID Set-Cookie from that response
        authenticates all subsequent requests. Choose the acting facility with
        `GET /openboxes/api/chooseLocation/{locationId}` if not set at login.
