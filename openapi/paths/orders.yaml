# ---------------------------------------------------------------------------
# PurchaseOrderApiController
# ---------------------------------------------------------------------------

/api/purchaseOrders:
  get:
    tags: [orders]
    summary: List purchase orders (JSON or CSV export)
    operationId: listPurchaseOrders
    parameters:
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/orderParam'
      - name: format
        in: query
        required: false
        description: '"csv" downloads a CSV export instead of JSON.'
        schema:
          type: string
      - name: orderItems
        in: query
        required: false
        description: With format=csv, "true" exports order line items instead of orders.
        schema:
          type: string
    responses:
      '200':
        description: Purchase order summaries (default GORM marshaling) or CSV.
        content:
          application/json:
            schema:
              type: object
              required: [data, totalPrice]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/PurchaseOrderSummary'
                totalPrice:
                  type: number
                totalCount:
                  type: integer
                  nullable: true
          text/csv:
            schema:
              type: string
      '500':
        $ref: '#/components/responses/ServerError'

/api/purchaseOrders/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [orders]
    summary: Read a purchase order (full domain marshaling)
    operationId: readPurchaseOrder
    x-contract-tests:
      - name: happy path needs a seeded purchase order
        skip: no seeded purchase order exists in demo data; missing-id path renders a text/html 404 and then attempts a second render (see behavioral findings)
    responses:
      '200':
        description: The order rendered with default GORM marshaling.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PurchaseOrderDetail'
      '404':
        description: Order not found; plain-text message via render(status:404, text) (content type text/html). The action does not return after this render.
  delete:
    tags: [orders]
    summary: Delete a pending purchase order
    operationId: deletePurchaseOrder
    responses:
      '204':
        description: Deleted (no content).
      '400':
        description: Order cannot be deleted (prepaid, non-pending, non-PO, or integrity violation).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersErrorMessages'
            example:
              errorMessages: ['Order could not be deleted']
      '404':
        description: Order not found ({errorMessage} rendered directly by the controller).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersErrorMessage'
            example:
              errorMessage: Order with id does-not-exist not found

/api/purchaseOrders/{id}/rollback:
  post:
    tags: [orders]
    summary: Roll back a purchase order's status
    operationId: rollbackPurchaseOrder
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Rolled back (empty body).
      '404':
        description: Order not found ({errorMessage} rendered directly by the controller).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersErrorMessage'
            example:
              errorMessage: Order with id does-not-exist not found
      '500':
        $ref: '#/components/responses/ServerError'

/api/orderSummaryStatus:
  get:
    tags: [orders]
    summary: Purchase order derived-status filter options
    operationId: purchaseOrderStatusOptions
    responses:
      '200':
        description: Derived status select options (with badge variant).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required: [id, value, label]
                    properties:
                      id:
                        type: string
                      value:
                        type: string
                      label:
                        type: string
                      variant:
                        type: string
                        nullable: true

# ---------------------------------------------------------------------------
# OrderAdjustmentTypeApiController
# ---------------------------------------------------------------------------

/api/orderAdjustmentTypes:
  get:
    tags: [orders]
    summary: List order adjustment types
    operationId: listOrderAdjustmentTypes
    parameters:
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
    responses:
      '200':
        description: Order adjustment types.
        content:
          application/json:
            schema:
              type: object
              required: [data, totalCount]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderAdjustmentTypeDetail'
                totalCount:
                  type: integer
  post:
    tags: [orders]
    summary: Create an order adjustment type
    operationId: createOrderAdjustmentType
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderAdjustmentTypeInput'
          example:
            name: Shipping surcharge
            description: Additional freight cost
            code: SHIPPING_FEE
    responses:
      '201':
        description: Created order adjustment type.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/OrderAdjustmentTypeDetail'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20003
                name: Shipping surcharge
                description: Additional freight cost
                code: SHIPPING_FEE
                glAccount: null
                dateCreated: '2024-01-01T00:00:00Z'
                lastUpdated: '2024-01-01T00:00:00Z'
      '400':
        $ref: '#/components/responses/BadRequest'

/api/orderAdjustmentTypes/formData:
