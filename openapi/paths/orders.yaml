          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [valid]
                  properties:
                    valid:
                      type: boolean
            example:
              data:
                valid: true
      '400':
        description: Validation errors.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersErrorMessages'
            example:
              errorMessages: ['Product received is required']

/api/receiveOrder/{id}/submit:
  post:
    tags: [orders]
    summary: Submit the receiving workflow (creates the order shipment/receipt)
    operationId: submitReceiveOrder
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReceiveOrderInput'
          example:
            shipmentTypeId: '1'
            shippedOn: 01/01/2024
            deliveredOn: 01/02/2024
            orderItems:
              - orderItemId: ff8081817f0e3f80017f0e40a1b20003
