      '400':
        description: Validation or persistence errors.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersErrorMessages'
            example:
              errorMessages: ['Shipment type is required']
      '404':
        description: Order not found ({errorMessages} rendered directly by the controller).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersErrorMessages'
            example:
              errorMessages: ['Unable to locate order with ID does-not-exist']

# ---------------------------------------------------------------------------
# PartialReceivingApiController
# ---------------------------------------------------------------------------

/api/partialReceiving:
  get:
    tags: [orders]
    summary: List partial receipts (always empty)
    operationId: listPartialReceiving
    responses:
      '200':
        description: Always an empty data array (the action is a stub).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    type: object
  post:
    tags: [orders]
    summary: Create partial receipt (mapped but not implemented)
    operationId: createPartialReceiving
    description: The URL mapping routes POST to a "create" action that does not exist on the controller, so the request fails with 404 (see behavioral findings).
    responses:
      '404':
        description: Action not found.

/api/partialReceiving/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Shipment id.
      schema:
        type: string
    - name: stepNumber
      in: query
      required: false
      schema:
        type: string
  get:
    tags: [orders]
    summary: Read the partial receipt for a shipment
    operationId: readPartialReceiving
    parameters:
      - name: sort
        in: query
        required: false
        schema:
          type: string
    x-contract-tests:
      - name: happy path needs a seeded inbound shipment
        skip: no seeded receivable shipment exists in demo data; a missing id raises an unhandled exception (500)
    responses:
      '200':
        description: The partial receipt (default Grails marshaling of the command object).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PartialReceipt'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [orders]
    summary: Save/complete/rollback a partial receipt
    operationId: updatePartialReceiving
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartialReceiptInput'
          example:
            receiptStatus: PENDING
            dateDelivered: 01/02/2024 12:00 +0000
            containers: []
    responses:
      '200':
        description: The refreshed partial receipt, or an empty object when completed.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PartialReceipt'
            example:
              data: {}
      '500':
        $ref: '#/components/responses/ServerError'

/api/partialReceiving/importCsv/{id}:
  post:
    tags: [orders]
    summary: Import receiving quantities from a CSV template
    operationId: importPartialReceivingCsv
    parameters:
      - name: id
        in: path
        required: true
        description: Shipment id.
        schema:
          type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              importFile:
                type: string
                format: binary
    responses:
      '200':
        description: Import succeeded.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
            example:
              data: Data was imported successfully
      '500':
        description: Any import error (including user errors such as editing non-importable columns) is rendered as a 500 with {errorCode, errorMessage}.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              errorCode: 500
              errorMessage: 'Receipt item id: 123 not found'

/api/partialReceiving/exportCsv/{id}:
  post:
    tags: [orders]
    summary: Export the partial receipt as a CSV template
    operationId: exportPartialReceivingCsv
    parameters:
      - name: id
        in: path
        required: true
        description: Shipment id.
        schema:
          type: string
      - name: stepNumber
        in: query
        required: false
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartialReceiptInput'
          example:
            containers: []
    responses:
      '200':
        description: CSV attachment (Content-disposition attachment).
        content:
          text/csv:
            schema:
              type: string
            example: 'Receipt item id,Shipment item id,Code,Name'
      '500':
        $ref: '#/components/responses/ServerError'

