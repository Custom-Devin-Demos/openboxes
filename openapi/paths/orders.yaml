# Orders domain fragment: OrderApiController, PurchaseOrderApiController,
# OrderAdjustmentTypeApiController, ReceiveOrderApiController,
# PartialReceivingApiController, FulfillmentApiController,
# ConsumptionApiController, BatchApiController, DataExportApiController,
# DocumentApiController. Map of <path> -> PathItem (see
# docs/migration/openapi-conventions.md).

# ---------------------------------------------------------------------------
# OrderApiController
# ---------------------------------------------------------------------------

/api/orders:
  get:
    tags: [orders]
    summary: List orders for the React order list screen
    operationId: listOrders
    parameters:
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
      - name: orderType
        in: query
        required: false
        description: Order type id or code (defaults to PURCHASE_ORDER).
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: OrderStatus enum name.
        schema:
          type: string
      - name: destination
        in: query
        required: false
        description: Destination location id (defaults to the session warehouse unless central purchasing is enabled).
        schema:
          type: string
      - name: statusStartDate
        in: query
        required: false
        description: MM/dd/yyyy
        schema:
          type: string
      - name: statusEndDate
        in: query
        required: false
        description: MM/dd/yyyy
        schema:
          type: string
    responses:
      '200':
        description: Paginated orders plus total normalized price.
        content:
          application/json:
            schema:
              type: object
              required: [data, totalCount, totalPrice]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderListItem'
                totalCount:
                  type: integer
                totalPrice:
                  type: number
      '500':
        $ref: '#/components/responses/ServerError'

/api/orders/statusOptions:
  get:
    tags: [orders]
    summary: Order status filter options
    operationId: orderStatusOptions
    responses:
