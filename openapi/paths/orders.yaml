# ---------------------------------------------------------------------------
# BatchApiController
# ---------------------------------------------------------------------------

/api/batch/importData:
  post:
    tags: [orders]
    summary: Validate/import an Excel data file (category, product, location, ...)
    operationId: batchImportData
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              importFile:
                type: string
                format: binary
              importType:
                type: string
                description: One of category, inventory, inventoryLevel, location, person, product, productAttribute, productCatalog, productCatalogItem, productSupplier, productSupplierPreference, productSupplierAttribute, productPackage, outboundStockMovement, tag, user, userLocation, productAssociation, productSynonym, purchaseOrderActualReadyDate.
              importNow:
                type: string
                description: '"true" performs the import; otherwise the file is only validated.'
              importDate:
                type: string
                description: yyyy-MM-dd HH:mm (required for importType=inventory).
    responses:
      '200':
        description: Import/validation outcome. Always 200; errors are reported in data.errors.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchImportResult'
            example:
              data:
                message: null
                errors: ['Please choose a valid import type']
                imported: false
                location: 'Main Warehouse'
                importType: null
                filename: /tmp/import.xls
                date: null
                columnMap: null
                data: []
      '500':
        $ref: '#/components/responses/ServerError'

