########################################################################
# StocklistItemApiController
########################################################################

/api/stocklistItems:
  get:
    tags: [stock-requisitions]
    summary: List stocklist items for a product
    operationId: listStocklistItems
    parameters:
      - name: product.id
        in: query
        required: true
        description: Missing product id throws IllegalArgumentException (HTTP 500).
        schema:
          type: string
    x-contract-tests:
      - name: seeded product
        query:
          product.id: '{productId}'
        status: 200
    responses:
      '200':
        description: Stocklist items.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataList'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Create a stocklist item
    operationId: createStocklistItem
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            stocklist: { id: stocklistId }
            product: { id: productId }
            maxQuantity: 10
    responses:
      '201':
        description: Created stocklist item.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: stocklistItemId
                maxQuantity: 10
      '500':
        $ref: '#/components/responses/ServerError'

/api/stocklistItems/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [stock-requisitions]
    summary: Read a stocklist item
    operationId: readStocklistItem
    x-contract-tests:
      - name: missing item returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: The stocklist item.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
      '404':
        $ref: '#/components/responses/NotFound'
  put:
    tags: [stock-requisitions]
    summary: Update a stocklist item
    operationId: updateStocklistItem
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            maxQuantity: 20
    responses:
      '200':
        description: The updated stocklist item.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: stocklistItemId
                maxQuantity: 20
      '500':
        $ref: '#/components/responses/ServerError'
  delete:
    tags: [stock-requisitions]
    summary: Remove a stocklist item
    operationId: removeStocklistItem
    x-contract-tests:
      - skip: "live delete would mutate seeded data"
    responses:
      '204':
        description: Removed (no content).
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Save a stocklist item (routed to "save", behaves like update)
    operationId: saveStocklistItem
    description: >-
      UrlMappings maps POST to a "save" action that does not exist on
      StocklistItemApiController; in practice the request executes the
      update flow, throwing IllegalArgumentException (HTTP 500 with message
      "No stocklist item fund with ID ...") for unknown ids.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            maxQuantity: 20
    responses:
      '200':
        description: The updated stocklist item.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: stocklistItemId
                maxQuantity: 20
      '500':
        $ref: '#/components/responses/ServerError'

