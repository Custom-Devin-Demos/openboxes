# Stock requisitions domain fragment: StockMovementApiController,
# StockMovementItemApiController, StockTransferApiController,
# PicklistApiController, ReplenishmentApiController, RequisitionApiController,
# RequisitionTemplateApiController, StocklistApiController,
# StocklistItemApiController, MobileApiController.
#
# Characterization of CURRENT behavior (this is not a redesign). Routes come
# from grails-app/controllers/org/pih/warehouse/UrlMappings.groovy (including
# the generic "/api/${resource}s" REST mappings). Where controllers render
# error bodies directly (without the shared errorCode field) the responses use
# the StockReqErrorMessage/StockReqErrorMessages components instead of the
# shared ErrorResponse.

########################################################################
# StockMovementApiController
########################################################################

/api/stockMovements:
  get:
    tags: [stock-requisitions]
    summary: List stock movements (requires direction; origin/destination filters)
    operationId: listStockMovements
    parameters:
      - name: direction
        in: query
        required: false
        description: INBOUND or OUTBOUND. Missing direction (or origin == destination) yields HTTP 400.
        schema:
          type: string
          enum: [INBOUND, OUTBOUND]
      - name: origin
        in: query
        required: false
        schema:
          type: string
      - name: destination
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Matches identifier, name or description.
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: "`csv` returns a CSV attachment instead of JSON."
        schema:
          type: string
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/orderParam'
    x-contract-tests:
      - name: outbound list
        query:
          direction: OUTBOUND
          origin: '{facilityId}'
          max: '5'
        status: 200
      - name: missing direction returns 400
        status: 400
    responses:
      '200':
        description: Paginated stock movements, or CSV when format=csv.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqPagedList'
          text/csv: {}
      '400':
        description: >-
          Direction parameter missing, or origin equals destination (both
          being absent/null also triggers this).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessages'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Create a stock movement
    operationId: createStockMovement
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            name: Test movement
            description: Test movement
            origin: { id: originLocationId }
            destination: { id: destinationLocationId }
            requestedBy: { id: personId }
            dateRequested: 01/01/2024
    responses:
      '201':
        description: Created stock movement.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: ff80818188f0d8bc0188f0e001230001
                name: Test movement
                statusCode: CREATED
      '500':
        $ref: '#/components/responses/ServerError'

/api/stockMovements/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [stock-requisitions]
    summary: Read a stock movement (totalCount varies with stepNumber workflow state)
    operationId: readStockMovement
    parameters:
      - name: stepNumber
        in: query
        required: false
        schema:
          type: string
    x-contract-tests:
      - skip: "requires the id of a seeded stock movement (no fixture placeholder); missing ids throw NPE (HTTP 500)"
    responses:
      '200':
        description: The stock movement with a workflow-step-dependent totalCount.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqPagedList'
      '500':
        $ref: '#/components/responses/ServerError'
  delete:
    tags: [stock-requisitions]
    summary: Delete a stock movement (requisition-, shipment- or order-based)
    operationId: deleteStockMovement
    x-contract-tests:
      - name: missing stock movement returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '204':
        description: Deleted (no content).
      '400':
        description: Not deletable (invoiced items, shipped status, wrong location...).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessage'
      '404':
        description: Stock movement not found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessage'

/api/stockMovements/{id}/status:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [stock-requisitions]
    summary: Read the status of a stock movement
    operationId: stockMovementStatus
    x-contract-tests:
      - skip: "requires the id of a seeded stock movement (no fixture placeholder)"
    responses:
      '200':
        description: Status string wrapped in a data envelope.
        content:
          application/json:
            schema:
              type: object
              properties:
                data: {}
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Transition a stock movement to a new status
    operationId: updateStockMovementStatus
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            status: DISPATCHED
    responses:
      '200':
        description: Transitioned (empty body).
      '500':
        $ref: '#/components/responses/ServerError'
  delete:
    tags: [stock-requisitions]
    summary: Rollback a stock movement status (redirects to the read action)
    operationId: deleteStockMovementStatus
    x-contract-tests:
      - skip: "live rollback would mutate seeded data"
    responses:
      '302':
        description: Redirect to GET /api/stockMovements/{id} after rollback.
      '500':
        $ref: '#/components/responses/ServerError'

