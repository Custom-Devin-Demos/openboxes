    summary: List stock transfers for a location
    operationId: listStockTransfers
    parameters:
      - name: location
        in: query
        required: true
        description: Location id; missing yields HTTP 400.
        schema:
          type: string
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
    x-contract-tests:
      - name: missing location returns 400
        status: 400
      - name: seeded location
        query:
          location: '{facilityId}'
        status: 200
    responses:
      '200':
        description: Stock transfers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqPagedList'
      '400':
        description: Location parameter missing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessage'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Create a stock transfer order
    operationId: createStockTransfer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            status: PENDING
            stockTransferItems: []
    responses:
      '200':
        description: The created stock transfer (HTTP 200, not 201).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: orderId
                status: PENDING
      '500':
        $ref: '#/components/responses/ServerError'

/api/stockTransfers/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [stock-requisitions]
    summary: Read a stock transfer
    operationId: readStockTransfer
    x-contract-tests:
      - skip: "requires the id of a seeded transfer order (no fixture placeholder); missing ids throw IllegalArgumentException (HTTP 500)"
    responses:
      '200':
        description: The stock transfer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Update a stock transfer (POST)
    operationId: updateStockTransfer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            status: COMPLETED
            stockTransferItems: []
    responses:
      '200':
        description: The updated stock transfer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: orderId
                status: COMPLETED
      '500':
        $ref: '#/components/responses/ServerError'
  put:
    tags: [stock-requisitions]
    summary: Update a stock transfer (PUT)
    operationId: updateStockTransferPut
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            status: PLACED
            stockTransferItems: []
    responses:
      '200':
        description: The updated stock transfer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: orderId
                status: PLACED
      '500':
        $ref: '#/components/responses/ServerError'
  delete:
    tags: [stock-requisitions]
    summary: Delete a transfer order
    operationId: deleteStockTransfer
    x-contract-tests:
      - name: missing order returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '204':
        description: Deleted (no content).
      '400':
        description: Order not deletable (status beyond APPROVED, or not a transfer order).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessage'
      '404':
        description: Order does not exist.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessage'

