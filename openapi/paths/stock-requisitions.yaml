    parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
    responses:
      '200':
        description: Stocklists.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqPagedList'
          text/csv: {}
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [stock-requisitions]
    summary: Create a stocklist
    operationId: createStocklist
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            name: Stocklist A
            origin: { id: originLocationId }
            destination: { id: destinationLocationId }
    responses:
      '201':
        description: Created stocklist.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: stocklistId
                name: Stocklist A
      '500':
        $ref: '#/components/responses/ServerError'

/api/stocklists/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [stock-requisitions]
    summary: Read a stocklist
    operationId: readStocklist
    x-contract-tests:
      - name: missing stocklist returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: The stocklist.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
      '404':
        $ref: '#/components/responses/NotFound'
  post:
    tags: [stock-requisitions]
    summary: Update a stocklist (POST)
    operationId: updateStocklist
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            name: Renamed stocklist
    responses:
      '200':
        description: The updated stocklist.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: stocklistId
                name: Renamed stocklist
      '500':
        $ref: '#/components/responses/ServerError'
  put:
    tags: [stock-requisitions]
    summary: Update a stocklist (PUT)
    operationId: updateStocklistPut
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
          example:
            name: Renamed stocklist
    responses:
      '200':
        description: The updated stocklist.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
            example:
              data:
                id: stocklistId
                name: Renamed stocklist
      '500':
        $ref: '#/components/responses/ServerError'
  delete:
    tags: [stock-requisitions]
    summary: Delete a stocklist
    operationId: deleteStocklist
    x-contract-tests:
      - skip: "live delete would mutate seeded data"
    responses:
      '204':
        description: Deleted (no content).
      '400':
        description: Existing associations prevent deletion.
        content:
          application/json:
            schema:
              type: object
              required: [errorMessages]
              properties:
                errorMessages:
                  type: array
                  items:
                    type: string
      '500':
        $ref: '#/components/responses/ServerError'

/api/stocklists/location/{id}:
  get:
    tags: [stock-requisitions]
    summary: Stocklist details for a location
    operationId: stocklistLocationDetails
    parameters:
      - name: id
        in: path
        required: true
        description: Location id.
        schema:
          type: string
    x-contract-tests:
      - name: seeded location
        params:
          id: '{facilityId}'
        status: 200
      - name: missing location returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Location stocklist details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqDataObject'
      '404':
        description: Location not found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockReqErrorMessage'

