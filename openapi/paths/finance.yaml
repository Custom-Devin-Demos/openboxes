/api/budgetCodes:
  get:
    tags: [finance]
    summary: List budget codes (filterable, paginated)
    operationId: listBudgetCodes
    parameters:
      - name: q
        in: query
        required: false
        description: Search term matched against code/name.
        schema:
          type: string
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: budgetCodeIds
        in: query
        required: false
        description: Restrict to specific budget code ids (repeatable).
        schema:
          type: string
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/orderParam'
    responses:
      '200':
        description: Paginated budget codes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCodeList'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [finance]
    summary: Create a budget code
    operationId: createBudgetCode
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BudgetCodeInput'
          example:
            code: SCRATCH
            name: Scratch budget code
            active: true
    responses:
      '201':
        description: Created budget code.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCodeResponse'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20003
