# Finance reference-data API: GL accounts, GL account types, budget codes,
# payment terms (GlAccountApiController, GlAccountTypeApiController,
# BudgetCodeApiController, PaymentTermApiController).

/api/glAccounts:
  get:
    tags: [finance]
    summary: List GL accounts (paginated, max capped at 100, default 10)
    operationId: listGlAccounts
    parameters:
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/orderParam'
    responses:
      '200':
        description: Paginated GL accounts.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlAccountList'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [finance]
    summary: Create a GL account
    operationId: createGlAccount
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GlAccountInput'
          example:
            code: '99999'
            name: Scratch GL account
            active: true
    responses:
      '201':
        description: Created GL account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlAccountResponse'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20001
                code: '99999'
                name: Scratch GL account
                description: null
                active: true
                glAccountType: null
                dateCreated: '2026-01-01T00:00:00Z'
                lastUpdated: '2026-01-01T00:00:00Z'
      '400':
        $ref: '#/components/responses/BadRequest'
      '500':
        $ref: '#/components/responses/ServerError'

/api/glAccounts/glAccountTypeOptions:
  get:
    tags: [finance]
    summary: List GL account type options (id + code label)
    operationId: listGlAccountTypeOptions
    responses:
      '200':
        description: GL account type select options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdLabelOptionList'
      '500':
        $ref: '#/components/responses/ServerError'

/api/glAccounts/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [finance]
    summary: Read a GL account by id
    operationId: readGlAccount
    x-contract-tests:
      - name: unknown id returns 404
        params:
          id: no-such-gl-account
        status: 404
    responses:
      '200':
        description: The GL account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlAccountResponse'
      '404':
        $ref: '#/components/responses/NotFound'
  put:
    tags: [finance]
    summary: Update a GL account
    operationId: updateGlAccount
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GlAccountInput'
          example:
            name: Renamed GL account
            active: true
    responses:
      '200':
        description: Updated GL account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlAccountResponse'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20001
                code: '99999'
                name: Renamed GL account
                description: null
                active: true
                glAccountType: null
                dateCreated: '2026-01-01T00:00:00Z'
                lastUpdated: '2026-01-01T00:00:00Z'
      '400':
        description: |
          Validation error (shared ErrorResponse shape), or the non-standard
          `{errorMessage}`-only body rendered when deactivating a GL account
          that is linked to a product.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/GlAccountDeactivationError'
            example:
              errorMessage: This GL account is linked to an active product and cannot be deactivated.
      '404':
        $ref: '#/components/responses/NotFound'
  delete:
    tags: [finance]
    summary: Delete a GL account
    operationId: deleteGlAccount
    x-contract-tests:
      - name: unknown id returns 404
        params:
          id: no-such-gl-account
        status: 404
    responses:
      '204':
        description: Deleted (no content).
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/ServerError'

