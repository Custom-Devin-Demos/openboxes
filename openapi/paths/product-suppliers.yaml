    operationId: updateProductSupplierPreference
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductSupplierPreferenceInput'
          example:
            comments: Updated comment
    responses:
      '200':
        description: The updated preference.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ProductSupplierPreference'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b2000a
