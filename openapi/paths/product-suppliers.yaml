/api/productSupplierPreferences/batch:
  post:
    tags: [productSuppliers]
    summary: Batch create or update product supplier preferences
    operationId: batchSaveProductSupplierPreferences
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [productSupplierPreferences]
            properties:
              productSupplierPreferences:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSupplierPreferenceInput'
          example:
            productSupplierPreferences:
              - productSupplier:
                  id: ff8081817f0e3f80017f0e40a1b20006
                preferenceType:
                  id: ff8081817f0e3f80017f0e40a1b20009
                comments: Batch-created preference
    responses:
      '200':
        description: The saved preferences.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductSupplierPreference'
            example:
              data:
                - id: ff8081817f0e3f80017f0e40a1b2000a
                  destinationParty: null
                  preferenceType:
                    id: ff8081817f0e3f80017f0e40a1b20009
                  validityStartDate: null
                  validityEndDate: null
                  comments: Batch-created preference
      '400':
        $ref: '#/components/responses/BadRequest'
