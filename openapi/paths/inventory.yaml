        status: 404
    responses:
      '200':
        description: The transaction entry.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionEntryReadResponse'
      '404':
        $ref: '#/components/responses/NotFound'
  put:
    tags: [inventory]
    summary: Update a transaction entry
    operationId: updateTransactionEntry
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionEntryInput'
          example:
            quantity: 10
            version: 0
    responses:
      '200':
        description: The updated entry.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionEntryReadResponse'
