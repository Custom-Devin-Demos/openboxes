              message: InventoryLevel deleted
              productId: seed-product-01
      '400':
        description: Delete failed (data integrity violation).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationErrorResponse'
            example:
              success: false
              errorMessages: ['InventoryLevel could not be deleted']
              productId: seed-product-01
      '404':
        description: Inventory level not found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationErrorResponse'
            example:
              success: false
              errorMessages: ['InventoryLevel not found']

