/api/inventory/transactions/{id}:
  get:
    tags: [inventory]
    summary: Edit transaction screen data provider
    operationId: getTransactionEditContext
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    x-contract-tests:
      - name: unknown transaction returns custom 404 body
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Transaction editing context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionEditContextResponse'
      '404':
        description: Transaction not found (custom `{error}` body, not the shared ErrorResponse).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionNotFoundResponse'

/api/inventory/saveTransaction:
  post:
    tags: [inventory]
    summary: Save transaction header (edit transaction screen)
    operationId: saveTransaction
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
          example:
            id: ff80818195a9d87b0195a9dd6a2c0001
            comment: Updated comment
    responses:
      '200':
        description: Transaction saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTransactionHeaderResponse'
            example:
              success: true
              message: Transaction saved
              id: ff80818195a9d87b0195a9dd6a2c0001
      '400':
        description: Save failed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTransactionHeaderResponse'
            example:
              success: false
              message: Unable to save transaction
              errors: ['Property [transactionType] cannot be null']
              id: null

/api/inventory/transactionEntries/{id}:
