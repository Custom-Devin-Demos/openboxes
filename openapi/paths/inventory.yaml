              success: true
              message: Transaction entry 123 deleted
      '404':
        description: Entry not found (`{success:false, message}` body with 404 status).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessMessageResponse'
            example:
              success: false
              message: Transaction entry 123 not found

/api/inventory/listTransactions:
  get:
    tags: [inventory]
    summary: Transaction list screen data provider
    operationId: listInventoryTransactions
    parameters:
      - name: transactionNumber
