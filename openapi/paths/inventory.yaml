        schema:
          type: string
      - name: transactionType.id
        in: query
        required: false
        schema:
          type: string
      - name: transactionDateFrom
        in: query
        required: false
        description: Formatted `MM/dd/yyyy`.
        schema:
          type: string
      - name: transactionDateTo
        in: query
        required: false
        description: Formatted `MM/dd/yyyy`.
        schema:
          type: string
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
    responses:
      '200':
        description: Transactions for the session warehouse.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListTransactionsResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventory/showTransaction/{id}:
  get:
    tags: [inventory]
    summary: Show transaction screen data provider
    operationId: showTransaction
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    x-contract-tests:
      - name: unknown transaction returns custom 404 body
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Transaction details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowTransactionResponse'
      '404':
        description: Transaction not found (custom `{error}` body).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionNotFoundResponse'

/api/inventory/deleteTransaction/{id}:
  delete:
    tags: [inventory]
    summary: Delete a transaction
    operationId: deleteTransaction
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Transaction deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessMessageResponse'
            example:
              success: true
              message: Transaction 123 deleted
      '400':
        description: Delete failed (data integrity violation).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessMessageResponse'
            example:
              success: false
              message: Transaction 123 could not be deleted
      '404':
        description: Transaction not found (`{success:false, message}` body).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessMessageResponse'
            example:
              success: false
              message: Transaction 123 not found

/api/inventory/listBinLocations:
  get:
    tags: [inventory]
    summary: Quantity on hand by bin location (manage inventory screen)
    operationId: listInventoryBinLocations
    responses:
      '200':
        description: Quantities by bin location for the session warehouse.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListBinLocationsQuantityResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventory/showProducts:
  get:
    tags: [inventory]
    summary: Products with empty lot number issues, grouped by category
    operationId: showProductsWithoutEmptyLotNumber
    responses:
      '200':
        description: Products grouped by category.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowProductsResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventory/uploadInventory:
  post:
    tags: [inventory]
    summary: Parse an uploaded inventory Excel file
    operationId: uploadInventory
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
          example:
            file: (binary xls content)
    responses:
      '200':
        description: Parsed inventory rows.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInventoryResponse'
            example:
              inventoryList:
                - - {key: product.productCode, value: DM0001}
                  - {key: quantity, value: '100'}
      '400':
        description: No file uploaded (custom `{error}` body).
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error:
                  type: string
            example:
              error: Please select a file to upload
      '500':
        $ref: '#/components/responses/ServerError'

# --- InventoryLevelApiController --------------------------------------------

/api/facilities/{facilityId}/inventory-levels:
  get:
    tags: [inventory]
    summary: List facility-level inventory levels
    operationId: listInventoryLevels
    parameters:
      - name: facilityId
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: Use `csv` or `xls` for file downloads instead of JSON.
        schema:
          type: string
    x-contract-tests:
      - name: seeded facility
        params:
          facilityId: '{facilityId}'
        status: 200
    responses:
      '200':
        description: Inventory levels without an internal location.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelListResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventoryLevels/search:
  get:
    tags: [inventory]
    summary: Search inventory levels (inventory level list screen)
    operationId: searchInventoryLevels
    parameters:
      - name: q
        in: query
        required: false
        description: Product search terms (space separated).
        schema:
          type: string
      - name: location.id
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/maxParam'
      - $ref: '#/components/parameters/offsetParam'
    responses:
      '200':
        description: Matching inventory levels plus location options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelSearchResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventoryLevels/formContext:
  get:
    tags: [inventory]
    summary: Inventory level create form context
    operationId: inventoryLevelCreateFormContext
    parameters:
      - name: product.id
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Form context (no existing inventory level).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelFormContextResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventoryLevels/{id}/formContext:
  get:
    tags: [inventory]
    summary: Inventory level edit form context
    operationId: inventoryLevelEditFormContext
    parameters:
      - name: id
        in: path
        required: true
        description: Inventory level id, or a product id (legacy fallback).
        schema:
          type: string
    x-contract-tests:
      - name: unknown id returns custom 404 body
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Form context for the existing inventory level.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelFormContextResponse'
      '404':
        description: Inventory level not found (custom `{errorMessage}` body).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelNotFoundResponse'

/api/inventoryLevels/{id}/details:
  get:
    tags: [inventory]
    summary: Inventory level details (show screen)
    operationId: inventoryLevelDetails
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    x-contract-tests:
      - name: unknown id returns custom 404 body
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Detailed inventory level.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelDetailsResponse'
      '404':
        description: Inventory level not found (custom `{errorMessage}` body).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelNotFoundResponse'

/api/inventoryLevels:
  post:
    tags: [inventory]
    summary: Create an inventory level
    operationId: createInventoryLevel
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            description: InventoryLevel fields bound from request parameters; product.id and location.id are required.
            additionalProperties: true
          example:
            product.id: seed-product-01
            location.id: seed-loc-main
            minQuantity: 10
    responses:
      '200':
        description: Inventory level created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationSuccessResponse'
            example:
              success: true
              message: InventoryLevel created
              id: ff8081817f0e3f80017f0e40a1b20003
              productId: seed-product-01
      '400':
        description: Duplicate inventory level or validation errors.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationErrorResponse'
            example:
              success: false
              errorMessages: ["Inventory level already exists for 'Product' in location 'Main Warehouse', bin location 'null' "]

/api/inventoryLevels/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [inventory]
    summary: Update an inventory level (POST alias)
    operationId: updateInventoryLevelPost
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
          example:
            minQuantity: 20
            version: 0
    responses:
      '200':
        description: Inventory level updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationSuccessResponse'
            example:
              success: true
              message: InventoryLevel updated
              productId: seed-product-01
      '400':
        description: Optimistic locking failure or validation errors.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationErrorResponse'
            example:
              success: false
              errorMessages: ['Another user has updated this InventoryLevel while you were editing']
      '404':
        description: Inventory level not found (`{success:false, errorMessages}` body).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelMutationErrorResponse'
            example:
              success: false
              errorMessages: ['InventoryLevel not found']
  put:
    tags: [inventory]
    summary: Update an inventory level
    operationId: updateInventoryLevelPut
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
          example:
            minQuantity: 20
    responses:
