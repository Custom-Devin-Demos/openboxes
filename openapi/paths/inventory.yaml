/api/inventory/editBinLocation:
  get:
    tags: [inventory]
    summary: Edit bin location screen data provider
    operationId: editBinLocation
    parameters:
      - name: productCode
        in: query
        required: false
        schema:
          type: string
      - name: binLocation
        in: query
        required: false
        description: Bin location name within the session warehouse.
        schema:
          type: string
      - name: lotNumber
        in: query
        required: false
        schema:
          type: string
    x-contract-tests:
      - name: seeded product code and lot number
        query:
          productCode: '{productCode}'
          lotNumber: LOT-ACE-001
        status: 200
      - name: missing lot number causes NPE (actual behavior)
        query:
          productCode: '{productCode}'
        status: 500
    responses:
      '200':
        description: Bin location editing context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBinLocationResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventory/adjustStock:
  post:
    tags: [inventory]
    summary: Save a stock adjustment (edit bin location screen)
    operationId: adjustStock
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            description: AdjustStockCommand fields bound from request parameters.
            properties:
              inventoryItem.id:
                type: string
              binLocation.id:
                type: string
              quantityAdjusted:
                type: integer
              reasonCode:
                type: string
              comment:
                type: string
          example:
            inventoryItem.id: ff8081817f0e3f80017f0e40a1b20003
            quantityAdjusted: 5
            reasonCode: DAMAGED_PRODUCT
    responses:
      '200':
        description: Adjustment saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessMessageResponse'
            example:
              success: true
              message: Inventory item ff8081817f0e3f80017f0e40a1b20003 updated
      '400':
        description: Validation failure (`{success:false, errors}`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessErrorsResponse'
            example:
              success: false
              errors: ['Property [inventoryItem] cannot be null']

/api/inventory/createTransaction:
  get:
    tags: [inventory]
    summary: Create transaction screen data provider
    operationId: getCreateTransactionContext
    parameters:
      - name: product.id
        in: query
        required: false
        description: Product id(s); either this or inventoryItem.id is required (500 otherwise).
        schema:
          type: string
      - name: inventoryItem.id
        in: query
        required: false
        schema:
          type: string
    x-contract-tests:
      - name: seeded product
        query:
          product.id: '{productId}'
        status: 200
      - name: no product or inventory item returns 500
        status: 500
    responses:
      '200':
        description: Transaction creation context.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionContextResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventory/saveAdjustmentTransaction:
  post:
    tags: [inventory]
    summary: Save an inventory adjustment transaction
    operationId: saveAdjustmentTransaction
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            description: TransactionCommand fields bound from request parameters.
            additionalProperties: true
          example:
            transactionInstance.transactionDate: 01/01/2025 12:00
    responses:
      '200':
        description: Transaction saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTransactionSuccessResponse'
            example:
              success: true
              message: Successfully saved transaction
              productId: seed-product-01
      '400':
        description: Validation failure (`{success:false, errors}`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessErrorsResponse'
            example:
              success: false
              errors: ['Transaction entry quantity is invalid']

/api/inventory/saveDebitTransaction:
  post:
    tags: [inventory]
    summary: Save a debit transaction (transfer out / consumption)
    operationId: saveDebitTransaction
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
          example:
            product.id: seed-product-01
    responses:
      '200':
        description: Transaction saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTransactionSuccessResponse'
            example:
              success: true
              message: Successfully saved transaction
              productId: seed-product-01
      '400':
        description: Validation failure.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessErrorsResponse'
            example:
              success: false
              errors: ['Transaction entry quantity is invalid']

/api/inventory/saveCreditTransaction:
  post:
    tags: [inventory]
    summary: Save a credit transaction (transfer in)
    operationId: saveCreditTransaction
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
          example:
            product.id: seed-product-01
    responses:
      '200':
        description: Transaction saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTransactionSuccessResponse'
            example:
