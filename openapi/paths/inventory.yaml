# Inventory domain (Phase 3 batch: inventory). Characterization specs for:
# InventoryApiController, InventoryLevelApiController,
# InventoryTransactionSummaryApiController, BinLocationApiController,
# InternalLocationApiController, CycleCountApiController,
# StockAdjustmentApiController, RecordStockApiController,
# StockCardApiController, TransactionEntryApiController.
#
# Map of <path> -> PathItem, merged into the root document's `paths`.

# --- InventoryApiController -------------------------------------------------

/api/facilities/{facilityId}/inventories/import:
  post:
    tags: [inventory]
    summary: Import inventory baseline quantities from a CSV file
    operationId: importInventoryCsv
    parameters:
      - name: facilityId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        text/csv:
          schema:
            type: string
            description: CSV payload. The request Content-Type must be exactly text/csv or a 500 is returned.
          example: |
            Product Code,Product Name,Lot Number,Expiration Date,Bin Location,Quantity
            DM0001,Acetaminophen 325mg tablet,,,,100
    responses:
      '200':
        description: Inventory imported (empty body).
      '400':
        $ref: '#/components/responses/BadRequest'
      '500':
        $ref: '#/components/responses/ServerError'

/api/facilities/{facilityId}/inventories/reorderReport:
  get:
    tags: [inventory]
    summary: Reorder report for a facility
    operationId: getReorderReport
    parameters:
      - name: facilityId
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: Use `csv` for a CSV download instead of JSON.
        schema:
          type: string
    x-contract-tests:
      - name: seeded facility
        params:
          facilityId: '{facilityId}'
        status: 200
    responses:
      '200':
        description: Reorder report rows.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderReportResponse'
      '400':
        $ref: '#/components/responses/BadRequest'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventories/expirationHistoryReport:
  get:
    tags: [inventory]
    summary: Expiration history report
    operationId: getExpirationHistoryReport
    parameters:
      - name: format
        in: query
        required: false
        description: Use `csv` for a CSV download instead of JSON.
        schema:
          type: string
    responses:
      '200':
        description: Expiration history rows plus totals.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpirationHistoryReportResponse'
      '400':
        $ref: '#/components/responses/BadRequest'
      '500':
        $ref: '#/components/responses/ServerError'

/api/inventory/browse:
