    summary: Delete a receipt (rolls back received stock)
    operationId: shipmentDeleteReceipt
    responses:
      '200':
        description: '`{success, message}` or `{success: false, errors}` (HTTP 200 in both cases).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentActionResult'
            example:
              success: true
              message: Receipt deleted
      '500':
        $ref: '#/components/responses/ServerError'

