            schema:
              $ref: '#/components/schemas/ShipmentWorkflowOptionsResponse'

/api/shipmentWorkflows/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [shipments]
    summary: Read a shipment workflow
    operationId: readShipmentWorkflow
    x-contract-tests:
      - name: missing workflow returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: The shipment workflow.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentWorkflowResponse'
      '404':
        $ref: '#/components/responses/NotFound'
  put:
    tags: [shipments]
    summary: Update a shipment workflow
    operationId: updateShipmentWorkflow
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShipmentWorkflowInput'
          example:
            name: Renamed workflow
            version: 0
    responses:
      '200':
        description: Updated shipment workflow.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentWorkflowResponse'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20006
                name: Renamed workflow
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'
  delete:
    tags: [shipments]
    summary: Delete a shipment workflow
    operationId: deleteShipmentWorkflow
    responses:
      '204':
        description: Deleted (no content).
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        description: Workflow is referenced by other data (integrity violation).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              errorCode: 409
              errorMessage: Cannot delete shipment workflow because it is in use

/api/createShipment:
  get:
    tags: [shipments]
    summary: Create-shipment workflow data for a new (unsaved) shipment
    operationId: createShipmentReadNew
    responses:
      '200':
        description: Workflow data with an unsaved shipment template.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentReadResponse'
      '500':
        $ref: '#/components/responses/ServerError'
