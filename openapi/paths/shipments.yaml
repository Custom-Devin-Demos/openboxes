/api/shipments/{id}/sendShipmentForm:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [shipments]
    summary: Send-shipment form data
    operationId: shipmentSendShipmentForm
    x-contract-tests:
      - name: missing shipment returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Send-shipment form data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentSendFormResponse'
      '404':
        $ref: '#/components/responses/NotFound'

/api/shipments/{id}/sendShipment:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [shipments]
    summary: Send a shipment
    operationId: shipmentSendShipment
    requestBody:
      required: false
      description: Parameters may also be sent as query/form params (parseRequest merges JSON into params).
      content:
        application/json:
          schema:
            type: object
            properties:
              actualShippingDate:
                type: string
                description: 'Format: MM/dd/yyyy HH:mm XXX. Must not be in the future.'
          example:
            actualShippingDate: 01/15/2024 10:00 +01:00
    responses:
      '200':
        description: |
          `{success: true, message}` when sent; `{success: false, errors}` for
          validation problems (still HTTP 200).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentActionResult'
            example:
              success: true
              message: Shipment sent on 01/15/2024
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/ServerError'

/api/shipments/{id}/receiveShipmentForm:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [shipments]
    summary: Receive-shipment form data
    operationId: shipmentReceiveShipmentForm
    x-contract-tests:
      - name: missing shipment returns 404
        params:
          id: does-not-exist
        status: 404
    responses:
      '200':
        description: Receive-shipment form data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentReceiveFormResponse'
      '404':
        $ref: '#/components/responses/NotFound'

/api/shipments/{id}/receiveShipment:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [shipments]
    summary: Receive (or credit/save receipt for) a shipment
    operationId: shipmentReceiveShipment
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              actualDeliveryDate:
                type: string
                description: 'Format: MM/dd/yyyy HH:mm XXX.'
              creditStockOnReceipt:
                type: boolean
          example:
            actualDeliveryDate: 01/20/2024 10:00 +01:00
            creditStockOnReceipt: true
    responses:
      '200':
        description: |
          `{success, received, message}` on success; `{success: false, errors}`
          for validation problems (still HTTP 200).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentActionResult'
            example:
              success: true
              received: false
              message: Shipment received on 01/20/2024
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/ServerError'

/api/shipments/receiptItems/{id}/split:
