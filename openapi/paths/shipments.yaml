      in: path
      required: true
      description: Receipt item id.
      schema:
        type: string
  post:
    tags: [shipments]
    summary: Split a receipt item into a new line
    operationId: shipmentSplitReceiptItem
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          example: {}
    responses:
      '200':
        description: |
          `{success, message}` or `{success: false, errors}`; a missing receipt
          item also renders `{success: false, errors}` with HTTP 200.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentActionResult'
            example:
              success: true
              message: Receipt item split
      '500':
        $ref: '#/components/responses/ServerError'

/api/shipments/receiptItems/{id}/delete:
  parameters:
