# Shipments batch: ShipmentApiController, ShipmentItemApiController,
# ShipmentWorkflowApiController, CreateShipmentApiController,
# CombineShipmentApiController, CombinedShipmentItemApiController,
# PackListApiController, DeliveryNoteApiController, GoodsReceiptNoteApiController,
# PutawayApiController, PutawayItemApiController.
# Characterization spec: documents current behavior exactly (see PR notes).

/api/shipments/shipmentList:
  get:
    tags: [shipments]
    summary: List shipments for the session warehouse with filters
    operationId: shipmentList
    parameters:
      - name: type
        in: query
        required: false
        description: '`incoming` lists inbound shipments; anything else lists outbound.'
        schema:
          type: string
      - name: terms
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: shipmentType
        in: query
        required: false
        schema:
          type: string
      - name: origin
        in: query
        required: false
        schema:
          type: string
      - name: destination
        in: query
        required: false
        schema:
          type: string
      - name: max
        in: query
        required: false
        description: Page size (default 100, capped at 10000). Not the shared pagination envelope.
        schema:
          type: integer
    responses:
      '200':
        description: Shipment rows plus echoed filters and filter options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentListResponse'
      '500':
        $ref: '#/components/responses/ServerError'

/api/shipments/commentForm:
  get:
    tags: [shipments]
    summary: Users available for shipment comment mentions
