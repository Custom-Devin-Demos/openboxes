    summary: Items and pending shipments for the add-to-shipment form
    operationId: shipmentAddToShipmentForm
    parameters:
      - name: productId
        in: query
        required: false
        description: Repeatable product id (product.id multi-param).
        schema:
          type: string
    responses:
      '200':
        description: Requested items and pending outbound shipments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentAddToShipmentFormResponse'
      '500':
        $ref: '#/components/responses/ServerError'

