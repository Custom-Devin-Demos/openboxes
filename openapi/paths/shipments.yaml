      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/orderParam'
    responses:
      '200':
        description: Shipment items (max defaults to 10, capped at 100).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentItemListResponse'
  post:
    tags: [shipments]
    summary: Create a shipment item
    operationId: createShipmentItem
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShipmentItemInput'
          example:
            shipment: ff8081817f0e3f80017f0e40a1b20001
            product: ff8081817f0e3f80017f0e40a1b20002
            quantity: 10
    responses:
      '201':
        description: Created shipment item.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentItemResponse'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20003
                quantity: 10
      '400':
        $ref: '#/components/responses/BadRequest'
      '500':
        $ref: '#/components/responses/ServerError'

