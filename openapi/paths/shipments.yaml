      in: path
      required: true
      description: Receipt item id.
      schema:
        type: string
  post:
    tags: [shipments]
    summary: Delete a receipt item
    operationId: shipmentDeleteReceiptItem
    responses:
      '200':
        description: |
          `{success, message}` or `{success: false, errors}`; a missing receipt
          item renders `{success: false, errors}` with HTTP 200 (not 404).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentActionResult'
            example:
              success: true
              message: Receipt item deleted
      '500':
        $ref: '#/components/responses/ServerError'

/api/shipments/receipts/{id}/delete:
