/api/putaways:
  get:
    tags: [shipments]
    summary: List putaway candidate items for a location
    operationId: listPutawayCandidates
    parameters:
      - name: location.id
        in: query
        required: false
        description: Location id (defaults to the session warehouse).
        schema:
          type: string
    responses:
      '200':
        description: Putaway candidate items (no totalCount).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutawayCandidatesResponse'
      '500':
        $ref: '#/components/responses/ServerError'
  post:
    tags: [shipments]
    summary: Create or update (and optionally complete) a putaway
    operationId: createPutaway
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PutawayInput'
          example:
            putawayStatus: PENDING
            putawayItems: []
    responses:
      '200':
        description: The saved putaway (HTTP 200, not 201).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutawayResponse'
            example:
              data:
                id: ff8081817f0e3f80017f0e40a1b20017
                putawayStatus: PENDING
                putawayItems: []
      '500':
        description: |
          Completed putaways cannot be updated; the IllegalArgumentException is
          rendered by the global error handler as a 500 ErrorResponse.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              errorCode: 500
              errorMessage: Can't update completed putaway

/api/putaways/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Putaway order id.
      schema:
        type: string
  get:
    tags: [shipments]
    summary: Read a putaway by its order id
    operationId: readPutaway
    x-contract-tests:
      - name: missing putaway raises IllegalArgumentException rendered as 500
        params:
          id: does-not-exist
        status: 500
    responses:
      '200':
        description: The putaway.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutawayResponse'
      '500':
        description: |
          Missing order ids raise IllegalArgumentException, rendered by the
          global error handler as HTTP 500 (not 404).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/putawayItems/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Order item id.
      schema:
        type: string
  delete:
    tags: [shipments]
    summary: Remove an item from a pending putaway
    operationId: deletePutawayItem
    responses:
      '204':
        description: Deleted (no content).
      '500':
        description: |
          Missing items or completed putaways raise IllegalArgumentException,
          rendered by the global error handler as HTTP 500 (not 404).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              errorCode: 500
              errorMessage: No putaway item found with ID does-not-exist
