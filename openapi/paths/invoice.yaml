      - name: documentId
        in: query
        required: false
        description: Existing document id to prefill the form with.
        schema:
          type: string
    x-contract-tests:
      - name: unknown id returns 500
        params:
          id: no-such-invoice
        status: 500
    responses:
      '200':
        description: Document form data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDocumentFormData'
      '500':
        $ref: '#/components/responses/ServerError'

/api/invoiceStatuses:
  get:
    tags: [invoice]
    summary: List invoice status options
    operationId: listInvoiceStatusOptions
    responses:
      '200':
        description: InvoiceStatus enum select options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceOptionsList'
      '500':
        $ref: '#/components/responses/ServerError'

/api/invoiceTypeCodes:
  get:
    tags: [invoice]
    summary: List invoice type code options
    operationId: listInvoiceTypeCodes
    responses:
      '200':
        description: InvoiceTypeCode enum select options.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceOptionsList'
      '500':
        $ref: '#/components/responses/ServerError'

/api/invoiceItems/{id}/validation:
  parameters:
    - name: id
      in: path
      required: true
      description: Invoice item id (routing only; body fields are validated).
      schema:
        type: string
  post:
    tags: [invoice]
    summary: Validate invoice item fields without saving
    operationId: validateInvoiceItem
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceItemValidationRequest'
          example:
            quantity: 1
            unitPrice: 10.5
    responses:
      '200':
        description: Valid (empty body).
      '400':
        $ref: '#/components/responses/BadRequest'
      '500':
        $ref: '#/components/responses/ServerError'

/api/prepaymentInvoices/{id}/invoiceItems:
  parameters:
    - name: id
      in: path
      required: true
      description: Final (non-prepayment) invoice id whose prepaid items are edited.
      schema:
        type: string
  post:
    tags: [invoice]
    summary: Bulk edit quantities of prepaid invoice items
    operationId: updatePrepaymentInvoiceItems
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrepaymentInvoiceItemsUpdateRequest'
          example:
            - id: ff8081817f0e3f80017f0e40a1b20007
              quantity: 2
    responses:
      '200':
        description: Items updated (empty body).
      '500':
        $ref: '#/components/responses/ServerError'

/api/prepaymentInvoiceItems/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Prepayment invoice item id.
      schema:
        type: string
  post:
    tags: [invoice]
    summary: Update a prepayment invoice item
    operationId: updatePrepaymentInvoiceItem
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrepaymentInvoiceItemUpdateRequest'
          example:
            quantity: 3
    responses:
      '200':
        description: Item updated (empty body).
      '500':
        $ref: '#/components/responses/ServerError'
  delete:
    tags: [invoice]
    summary: Delete a prepayment invoice item
    operationId: deletePrepaymentInvoiceItem
    responses:
      '204':
        description: Item deleted (no content).
      '500':
        $ref: '#/components/responses/ServerError'
