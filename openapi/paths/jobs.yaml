    tags: [jobs]
    summary: Start the Quartz scheduler
    operationId: jobsStartScheduler
    description: Schema-only in contract tests (mutates scheduler state).
    responses:
      '200':
        description: 'Always `{data: {message: null}}`.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageResponse'
            example:
              data:
                message: null

/api/jobs/stopScheduler:
  post:
    tags: [jobs]
    summary: Put the Quartz scheduler in standby mode
    operationId: jobsStopScheduler
    description: Schema-only in contract tests (mutates scheduler state).
    responses:
      '200':
        description: 'Always `{data: {message: null}}`.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageResponse'
            example:
              data:
                message: null

/api/jobs/triggers/{id}:
  delete:
    tags: [jobs]
    summary: Unschedule a trigger by trigger key
    operationId: jobsUnscheduleTrigger
    description: |
      Always responds 200; `data.message` is null when the trigger was
      unscheduled or an explanation when it was not found. Schema-only in
      contract tests (mutates scheduler state).
    parameters:
      - name: id
        in: path
        required: true
        description: Trigger key name.
        schema:
          type: string
    responses:
      '200':
        description: Result message (null on success).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageResponse'
            example:
              data:
                message: Unable to unschedule trigger with trigger key unknown-trigger

/api/jobs/{id}/schedule:
  post:
    tags: [jobs]
    summary: Schedule a job (currently always fails)
    operationId: jobsScheduleJob
    description: |
      Characterized as-is: the action calls `quartzScheduler.scheduleJob(trigger)`
      with an uninitialized (null) trigger, so it always raises an exception
      rendered as a 500 error. The `cronExpression` parameter is accepted but
      never used to build a trigger. Schema-only in contract tests.
    parameters:
      - name: id
        in: path
        required: true
        description: Quartz job key name.
        schema:
          type: string
      - name: cronExpression
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Result message (documented shape; not reachable in practice).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageResponse'
            example:
              data:
                message: Job GRAILS_JOBS.someJob scheduled null
      '500':
        $ref: '#/components/responses/ServerError'
