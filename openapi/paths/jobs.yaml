# Quartz jobs API (JobApiController). Explicit /api/jobs/* mappings plus the
# generic REST mapping "/api/${resource}s/$id" which routes
# GET /api/jobs/{id} to JobApiController.read.

/api/jobs/list:
  get:
    tags: [jobs]
    summary: List Quartz jobs with trigger state
    operationId: jobsList
    responses:
      '200':
        description: All jobs (one entry per trigger) and scheduler standby state.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobList'

/api/jobs/{id}:
  get:
    tags: [jobs]
    summary: Read a Quartz job detail by job name
    operationId: jobsRead
    description: |
      Routed by the generic "/api/${resource}s/$id" REST mapping. `id` is the
      Quartz job name (fully-qualified job class name); `group` defaults to
      GRAILS_JOBS. An unknown job name raises a SchedulerException, which is
      rendered as a 500 error (not 404).
    parameters:
      - name: id
        in: path
        required: true
        description: Quartz job name.
        schema:
          type: string
      - name: group
        in: query
        required: false
        description: Quartz job group (default GRAILS_JOBS).
        schema:
          type: string
    x-contract-tests:
      - name: read a known job
        params:
          id: org.pih.warehouse.jobs.UpdateExchangeRatesJob
        status: 200
      - name: unknown job name returns 500
        params:
          id: does-not-exist
        status: 500
    responses:
      '200':
        description: Job detail with properties and triggers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDetail'
      '500':
        $ref: '#/components/responses/ServerError'

/api/jobs/stopJob:
  post:
    tags: [jobs]
    summary: Unschedule a job's trigger (remembering it for restart)
    operationId: jobsStopJob
    description: |
      Always responds 200; `data.message` is null on success or an explanation
      when the trigger was not found. Schema-only in contract tests (mutates
      scheduler state).
    parameters:
      - name: triggerGroup
        in: query
        required: false
        schema:
          type: string
      - name: triggerName
        in: query
        required: false
        schema:
          type: string
      - name: jobName
        in: query
        required: false
        description: Key under which the stopped trigger is remembered.
        schema:
          type: string
    responses:
      '200':
        description: Result message (null on success).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageResponse'
            example:
              data:
                message: null

/api/jobs/startJob:
  post:
    tags: [jobs]
    summary: Re-schedule a previously stopped job trigger
    operationId: jobsStartJob
    description: Schema-only in contract tests (mutates scheduler state).
    parameters:
      - name: jobName
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Result message (null on success).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobMessageResponse'
            example:
              data:
                message: No trigger could be found for org.pih.warehouse.jobs.UnknownJob

