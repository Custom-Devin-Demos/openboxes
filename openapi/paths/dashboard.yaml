# Dashboard API (DashboardApiController). Widget endpoints render NumberData /
# GraphData value objects directly (no {data,totalCount} envelope).

/api/dashboard/config:
  post:
    tags: [dashboard]
    summary: Update the current user's dashboard configuration
    operationId: updateDashboardConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardConfig'
          example:
            dashboard: null
            dashboardWidgets: {}
    responses:
      '200':
        description: The updated dashboard configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardConfig'
            example:
              dashboard: null
              dashboardWidgets: {}
      '500':
        $ref: '#/components/responses/ServerError'

/api/dashboard/{id}/config:
  parameters:
    - name: id
      in: path
      required: true
      description: Dashboard id (e.g. personal).
      schema:
        type: string
  get:
    tags: [dashboard]
    summary: Get the current user's dashboard configuration
    operationId: getDashboardConfig
    x-contract-tests:
      - name: personal dashboard
        params:
          id: personal
        status: 200
    responses:
      '200':
        description: Dashboard configuration for the given dashboard id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardConfig'
      '500':
        $ref: '#/components/responses/ServerError'

/api/dashboard/{id}/subdashboardKeys:
  parameters:
    - name: id
      in: path
      required: true
      description: Dashboard id (falls back to the configured main dashboard when blank).
      schema:
        type: string
  get:
    tags: [dashboard]
    summary: List subdashboard keys of a dashboard config
    operationId: getSubdashboardKeys
    x-contract-tests:
      - name: personal dashboard
        params:
          id: personal
        status: 200
    responses:
      '200':
        description: Bare JSON array of subdashboard keys.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardSubdashboardKeys'
      '500':
        $ref: '#/components/responses/ServerError'

