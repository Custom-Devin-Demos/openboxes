# Schemas for the Quartz jobs API (JobApiController). See paths/jobs.yaml.

JobMessageResponse:
  type: object
  description: |
    Message envelope returned by job mutation endpoints. `message` is null on
    success and holds an explanation when the job/trigger was not found.
  required:
    - data
  properties:
    data:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          nullable: true
          example: null

JobSummary:
  type: object
  required:
    - group
    - name
  properties:
    group:
      type: string
      example: GRAILS_JOBS
    name:
      type: string
      example: org.pih.warehouse.jobs.AssignIdentifierJob
    status:
      type: string
      nullable: true
      example: complete
    error:
      type: string
      nullable: true
    duration:
      type: integer
      nullable: true
    lastRun:
      type: string
      nullable: true
    triggerStatus:
      type: string
      nullable: true
      example: NORMAL
    trigger:
      type: object
      nullable: true
      required:
        - name
        - group
      properties:
        name:
          type: string
        group:
          type: string
        nextFireTime:
          type: string
          nullable: true
        nextFireTimestamp:
          type: integer
          nullable: true
        mayFireAgain:
          type: boolean
        isCronTrigger:
          type: boolean

JobList:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - jobs
        - now
        - nowTime
        - schedulerInStandbyMode
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobSummary'
        now:
          type: string
        nowTime:
          type: integer
        schedulerInStandbyMode:
          type: boolean

JobDetail:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - key
        - name
        - group
        - properties
        - triggers
      properties:
        key:
          type: string
          example: GRAILS_JOBS.org.pih.warehouse.jobs.AssignIdentifierJob
        name:
          type: string
        group:
          type: string
        properties:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                nullable: true
              value:
                type: string
                nullable: true
        triggers:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
              summary:
                type: string
                nullable: true
              previousFireTime:
                type: string
                nullable: true
              nextFireTime:
                type: string
                nullable: true
