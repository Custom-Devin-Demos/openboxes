# Schemas for the shipments batch (ShipmentApiController, ShipmentItemApiController,
# ShipmentWorkflowApiController, CreateShipmentApiController, CombineShipmentApiController,
# CombinedShipmentItemApiController, PackListApiController, DeliveryNoteApiController,
# GoodsReceiptNoteApiController, PutawayApiController, PutawayItemApiController).
# Characterization schemas: they describe the actual JSON rendered today.

IdName:
  type: object
  description: Minimal id/name pair rendered for many nested references.
  properties:
    id:
      type: string
      nullable: true
    name:
      type: string
      nullable: true

IdLabel:
  type: object
  description: Option entry (`{id, label}`) rendered by options endpoints.
  properties:
    id:
      type: string
      nullable: true
    label:
      type: string
      nullable: true

PrettyDate:
  type: object
  nullable: true
  description: Date rendered as a pretty-time phrase plus an exact title.
  properties:
    pretty:
      type: string
      nullable: true
    title:
      type: string
      nullable: true

ShipmentSummary:
  type: object
  description: Shipment summary map rendered by ShipmentApiController.getShipmentSummary.
  required: [id]
  properties:
    id:
      type: string
    version:
      type: integer
      nullable: true
    name:
      type: string
      nullable: true
    shipmentNumber:
      type: string
      nullable: true
    shipmentType:
      type: object
      nullable: true
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        defaultName:
          type: string
          nullable: true
    origin:
      $ref: '#/components/schemas/IdName'
    destination:
      $ref: '#/components/schemas/IdName'
    hasShipped:
      type: boolean
      nullable: true
    wasReceived:
      type: boolean
      nullable: true
    expectedShippingDate:
      type: string
      nullable: true
    actualShippingDate:
      type: string
      nullable: true
    expectedDeliveryDate:
      type: string
      nullable: true
    actualDeliveryDate:
      type: string
      nullable: true
    numItems:
      type: integer
      nullable: true
    totalValue:
      type: number
      nullable: true
    currencyCode:
      type: string
      nullable: true
    totalWeightInPounds:
      type: number
      nullable: true
    status:
      type: string
      nullable: true
    direction:
      type: string
      nullable: true
      description: OUTBOUND / INBOUND relative to the session warehouse, or null.

ShipmentSummaryResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/components/schemas/ShipmentSummary'

ShipmentListEntry:
  type: object
  description: One row of the shipment list (GET /api/shipments/shipmentList).
  properties:
    id:
      type: string
      nullable: true
    shipmentNumber:
      type: string
      nullable: true
    name:
      type: string
      nullable: true
    statusCode:
      type: string
      nullable: true
    statusName:
      type: string
      nullable: true
    shipmentType:
      type: object
      nullable: true
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        defaultName:
          type: string
          nullable: true
    shipmentItemCount:
      type: integer
      nullable: true
    origin:
      type: string
      nullable: true
    destination:
      type: string
      nullable: true
    actualShippingDate:
      $ref: '#/components/schemas/PrettyDate'
    expectedShippingDate:
      $ref: '#/components/schemas/PrettyDate'
    actualDeliveryDate:
      $ref: '#/components/schemas/PrettyDate'
    expectedDeliveryDate:
      $ref: '#/components/schemas/PrettyDate'
    lastUpdated:
      $ref: '#/components/schemas/PrettyDate'

ShipmentListResponse:
  type: object
  description: |
    Response of GET /api/shipments/shipmentList. Note this is NOT the shared
    `{data, totalCount}` pagination envelope: `data` is a map holding the rows
    plus the echoed filters and filter options.
  required: [data]
  properties:
    data:
      type: object
      properties:
        incoming:
          type: boolean
        maxReached:
          type: boolean
          nullable: true
        max:
          type: integer
        warehouseName:
          type: string
          nullable: true
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentListEntry'
        filters:
          type: object
          properties:
            terms:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
            type:
              type: string
            shipmentType:
              type: string
              nullable: true
            origin:
              type: string
              nullable: true
            destination:
              type: string
              nullable: true
        filterOptions:
          type: object
          properties:
            statuses:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
            shipmentTypes:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
            locations:
              type: array
              items:
                $ref: '#/components/schemas/IdName'

ShipmentContainerSummary:
  type: object
  nullable: true
  description: Container summary rendered by ShipmentApiController.getContainerSummary.
  properties:
    id:
      type: string
      nullable: true
    name:
      type: string
      nullable: true
    parentContainerName:
      type: string
      nullable: true
    containerTypeName:
      type: string
      nullable: true
    weight:
      type: number
      nullable: true
    weightUnits:
      type: string
      nullable: true
    height:
      type: number
      nullable: true
    width:
      type: number
      nullable: true
    length:
      type: number
      nullable: true
    volumeUnits:
      type: string
      nullable: true

ShipmentDetailsResponse:
  type: object
  description: |
    Response of GET /api/shipments/{id}/showDetails. `data` carries the summary
    plus items, receipt items, events, and view context flags.
  required: [data]
  properties:
    data:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/ShipmentSummary'
        statusCode:
          type: string
          nullable: true
        statusName:
          type: string
          nullable: true
        isFromPurchaseOrder:
          type: boolean
          nullable: true
        originCode:
          type: string
          nullable: true
        originName:
          type: string
          nullable: true
        destinationName:
          type: string
          nullable: true
        totalWeightInPounds:
          type: number
          nullable: true
        totalValue:
          type: number
          nullable: true
        currencyCode:
          type: string
          nullable: true
        showTotalValue:
          type: boolean
          nullable: true
        carrier:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
        additionalInformation:
          type: string
          nullable: true
        documentTemplate:
          type: string
          nullable: true
        referenceNumbers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                nullable: true
              identifiers:
                type: array
                items:
                  type: string
        comments:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        leadTime:
          type: object
          properties:
            timeToProcess:
              type: string
              nullable: true
            timeInCustoms:
              type: string
              nullable: true
            timeInTransit:
              type: string
              nullable: true
        shipmentItems:
          type: array
          items:
            type: object
            additionalProperties: true
        receiptItems:
          type: array
          items:
            type: object
            additionalProperties: true
        hasReceipt:
          type: boolean
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        eventLocations:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        defaultEventLocationId:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true

ShipmentCommentFormResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              username:
                type: string
                nullable: true

ShipmentDocumentFormResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      properties:
        document:
          type: object
          nullable: true
          additionalProperties: true
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/IdName'

ShipmentEventFormResponse:
  type: object
