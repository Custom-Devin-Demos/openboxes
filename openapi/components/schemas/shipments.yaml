          nullable: true
        checklistItems:
          type: array
          items:
            type: object
            additionalProperties: true

ShipmentSendFormResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      additionalProperties: true
      properties:
        summary:
          $ref: '#/components/schemas/ShipmentSummary'
        shipmentItems:
          type: array
          items:
            type: object
            additionalProperties: true
        recipients:
          type: array
          items:
            type: object
            additionalProperties: true

ShipmentReceiveFormResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      additionalProperties: true
      properties:
        summary:
          $ref: '#/components/schemas/ShipmentSummary'
        warningMessage:
          type: string
          nullable: true
        receiptId:
          type: string
          nullable: true
        hasBinLocationSupport:
          type: boolean
        binLocations:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        receiptItems:
          type: array
          items:
            type: object
            additionalProperties: true

ShipmentActionResult:
  type: object
  description: |
    `{success, message}` on success or `{success: false, errors: [...]}` on
    failure — both rendered with HTTP 200 by ShipmentApiController actions.
  required: [success]
  properties:
    success:
      type: boolean
    received:
      type: boolean
      nullable: true
    message:
      type: string
      nullable: true
    errors:
      type: array
      items:
        type: string
        nullable: true

ShipmentPutawayLocationsResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/IdName'
        binLocations:
          type: array
          items:
            type: object
            properties:
              binLocationName:
                type: string
                nullable: true
              lotNumber:
                type: string
                nullable: true
              expirationDate:
                type: string
                nullable: true
              quantity:
                type: number
                nullable: true
              unitOfMeasure:
                type: string
                nullable: true

ShipmentAddToShipmentFormResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        pendingShipments:
          type: array
          items:
            type: object
            additionalProperties: true

ShipmentItem:
  type: object
  description: ShipmentItem JSON rendered by ShipmentItemApiController.toJson.
  required: [id]
  properties:
    id:
      type: string
    container:
      $ref: '#/components/schemas/IdName'
    product:
      type: object
      nullable: true
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        productCode:
          type: string
          nullable: true
        unitOfMeasure:
          type: string
          nullable: true
    lotNumber:
      type: string
      nullable: true
    expirationDate:
      type: string
      nullable: true
    quantity:
      type: integer
      nullable: true
    recipient:
      $ref: '#/components/schemas/IdName'
    inventoryItem:
      type: object
      nullable: true
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        lotNumber:
          type: string
          nullable: true
    donor:
      $ref: '#/components/schemas/IdName'
    binLocation:
      $ref: '#/components/schemas/IdName'
    dateCreated:
      type: string
      nullable: true
    lastUpdated:
      type: string
      nullable: true
    orderItems:
      type: array
      items:
        $ref: '#/components/schemas/IdName'
    shipment:
      $ref: '#/components/schemas/IdName'
    version:
      type: integer
      nullable: true

ShipmentItemListResponse:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/ShipmentItem'
    totalCount:
      type: integer

ShipmentItemResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/components/schemas/ShipmentItem'

ShipmentItemInput:
  type: object
  description: |
    Request body accepted by ShipmentItemApiController create/update
    (bindShipmentItemData). All association fields take ids.
  properties:
    container:
      type: string
      nullable: true
    product:
      type: string
      nullable: true
    lotNumber:
      type: string
      nullable: true
    expirationDate:
      type: string
      nullable: true
      description: yyyy-MM-dd (only the first 10 characters are parsed).
    quantity:
      type: integer
      nullable: true
    recipient:
      type: string
      nullable: true
    inventoryItem:
      type: string
      nullable: true
    donor:
      type: string
      nullable: true
    shipment:
      type: string
      nullable: true
    version:
      type: integer
      nullable: true
      description: Optimistic-locking version (update only).

