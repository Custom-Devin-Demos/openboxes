          additionalProperties: true
        options:
          type: object
          properties:
            shipmentTypes:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
            origins:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
            destinations:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
            shippers:
              type: array
              items:
                $ref: '#/components/schemas/IdName'
        containers:
          type: array
          items:
            type: object
            additionalProperties: true
        shipmentItems:
          type: array
          items:
            type: object
            additionalProperties: true
        emailRecipients:
          type: array
          items:
            type: object
            additionalProperties: true

