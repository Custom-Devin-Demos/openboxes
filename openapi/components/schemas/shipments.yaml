      properties:
        event:
          type: object
          nullable: true
          additionalProperties: true
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/IdName'

ShipmentPackingListResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/ShipmentSummary'
        wasReceived:
          type: boolean
        shipmentItems:
          type: array
          items:
            type: object
            additionalProperties: true

ShipmentPaginatedPackingListResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      properties:
        shipment:
          type: object
          additionalProperties: true
        containers:
          type: array
          items:
            type: object
            properties:
              container:
                $ref: '#/components/schemas/ShipmentContainerSummary'
              shipmentItems:
                type: array
                items:
                  type: object
                  additionalProperties: true

ShipmentPickListReportResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      properties:
        shipment:
          type: object
          additionalProperties: true
        printedBy:
          type: string
          nullable: true
        printedOn:
          type: string
        containers:
          type: array
          items:
            type: object
