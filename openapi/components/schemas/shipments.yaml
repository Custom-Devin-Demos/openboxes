        products:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        persons:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        inventoryItems:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        donors:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'

ShipmentItemBinLocationEntry:
  type: object
  properties:
