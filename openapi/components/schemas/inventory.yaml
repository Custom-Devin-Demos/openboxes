# Inventory domain schemas (InventoryApiController, InventoryLevelApiController,
# InventoryTransactionSummaryApiController, BinLocationApiController,
# InternalLocationApiController, CycleCountApiController,
# StockAdjustmentApiController, RecordStockApiController, StockCardApiController,
# TransactionEntryApiController). Characterization of current behavior only.

ProductSummary:
  type: object
  description: Minimal product reference `{id, productCode, name}` used across inventory responses.
  properties:
    id:
      type: string
    productCode:
      type: string
      nullable: true
    name:
      type: string
      nullable: true

InventoryProductReference:
  type: object
  description: Product reference with unit of measure (InventoryApiController.serializeProduct).
  nullable: true
  properties:
    id:
      type: string
    productCode:
      type: string
      nullable: true
    name:
      type: string
      nullable: true
    unitOfMeasure:
      type: string
      nullable: true

IdNamePair:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
      nullable: true

InventoryItemReference:
  type: object
  description: Inventory item reference (InventoryApiController.serializeInventoryItem).
  nullable: true
  properties:
    id:
      type: string
    lotNumber:
      type: string
      nullable: true
    expirationDate:
      type: string
      nullable: true
      description: Formatted as `MMM dd, yyyy`.
    productId:
      type: string
      nullable: true

SuccessMessageResponse:
  type: object
  description: Common `{success, message}` mutation response.
  required: [success]
  properties:
    success:
      type: boolean
    message:
      type: string
      nullable: true

SuccessErrorsResponse:
  type: object
  description: 'Common `{success: false, errors: [...]}` 400 mutation response.'
  required: [success]
  properties:
    success:
      type: boolean
    errors:
      type: array
      items:
        type: string

InventoryBrowseResponse:
  type: object
  description: Response of GET /api/inventory/browse.
  required: [searchResults, filterOptions]
  properties:
    searchTerms:
      type: string
      nullable: true
    categoryId:
      type: string
      nullable: true
    tags:
      type: array
      nullable: true
      items:
        type: string
    catalogs:
      type: array
      nullable: true
      items:
        type: string
    productTypes:
      type: array
      nullable: true
      items:
        type: string
    showOutOfStockProducts:
      type: boolean
      nullable: true
    maxResults:
      type: integer
      nullable: true
    offset:
      type: integer
      nullable: true
    totalCount:
      type: integer
    searchResults:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          productCode:
            type: string
            nullable: true
          name:
            type: string
            nullable: true
          color:
            type: string
            nullable: true
          hasImage:
            type: boolean
          imageId:
            type: string
            nullable: true
          productType:
            type: object
            nullable: true
            additionalProperties: true
            description: See #/components/schemas/IdNamePair
          category:
            type: object
            nullable: true
            additionalProperties: true
            description: See #/components/schemas/IdNamePair
          tags:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                tag:
                  type: string
                  nullable: true
          catalogs:
            type: array
            items:
              $ref: '#/components/schemas/IdNamePair'
          quantityOnHand:
            type: number
    filterOptions:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: true
        tags:
          type: array
          items:
            type: object
            additionalProperties: true
        catalogs:
          type: array
          items:
            type: object
            additionalProperties: true
        productTypes:
          type: array
          items:
            $ref: '#/components/schemas/IdNamePair'

StockListResponse:
  type: object
  description: Response of listInventory / listLowStock / listReorderStock.
  required: [hasRoleFinance, categories, data]
  properties:
    hasRoleFinance:
      type: boolean
    categories:
      type: array
      items:
        type: object
        additionalProperties: true
    data:
      type: array
      items:
        type: object
        properties:
          status:
            type: string
            nullable: true
          product:
            type: object
            properties:
              id:
                type: string
              productCode:
                type: string
                nullable: true
              name:
                type: string
                nullable: true
              color:
                type: string
                nullable: true
              productGroups:
                type: array
                items:
                  type: string
              category:
                type: string
                nullable: true
              abcClass:
                type: string
                nullable: true
              unitOfMeasure:
                type: string
                nullable: true
              pricePerUnit:
                type: number
                nullable: true
          minQuantity:
            type: number
            nullable: true
          reorderQuantity:
            type: number
            nullable: true
          maxQuantity:
            type: number
            nullable: true
          quantity:
            type: number
            nullable: true
          quantityAvailableToPromise:
            type: number
            nullable: true
          totalValue:
            type: number
            nullable: true

DailyTransactionsResponse:
  type: object
  description: Response of GET /api/inventory/listDailyTransactions.
  required: [dateSelected, transactionsByDate, transactions]
  properties:
    dateSelected:
      type: string
      description: Formatted `dd/MM/yyyy`.
    transactionsByDate:
      type: array
      items:
        type: object
        properties:
          date:
            type: string
          count:
            type: integer
    transactions:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          transactionNumber:
            type: string
            nullable: true
          dateCreated:
            type: string
            nullable: true
          transactionType:
            type: string
            nullable: true
          source:
            type: string
            nullable: true
          destination:
            type: string
            nullable: true
          entries:
            type: array
            items:
              type: object
              properties:
                product:
                  $ref: '#/components/schemas/InventoryProductReference'
                lotNumber:
                  type: string
                  nullable: true
                quantity:
                  type: number
                  nullable: true

ExpirationStockListResponse:
  type: object
  description: Response of listExpiredStock / listExpiringStock.
  required: [categories, data]
  properties:
    categories:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    data:
      type: array
      items:
        type: object
        properties:
          inventoryItem:
            type: object
            properties:
              id:
                type: string
              lotNumber:
                type: string
                nullable: true
              expirationDate:
                type: string
                nullable: true
                description: Formatted `d MMM yyyy`.
              product:
                type: object
                additionalProperties: true
          quantity:
            type: number
            nullable: true

EditBinLocationResponse:
  type: object
  description: Response of GET /api/inventory/editBinLocation.
  required: [location, reasonCodes]
  properties:
    location:
      $ref: '#/components/schemas/IdNamePair'
    binLocation:
      type: object
      nullable: true
      additionalProperties: true
      description: See #/components/schemas/IdNamePair
    inventoryItem:
      type: object
      nullable: true
      additionalProperties: true
    quantity:
      type: number
      nullable: true
    reasonCodes:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'

CreateTransactionContextResponse:
  type: object
  description: Response of GET /api/inventory/createTransaction (requires product.id or inventoryItem.id).
  required: [location, products]
  properties:
    location:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        inventoryId:
          type: string
          nullable: true
        hasBinLocationSupport:
          type: boolean
    products:
      type: array
      items:
        $ref: '#/components/schemas/InventoryProductReference'
    binLocations:
      type: array
      items:
        type: object
        properties:
          product:
            $ref: '#/components/schemas/InventoryProductReference'
          inventoryItem:
            $ref: '#/components/schemas/InventoryItemReference'
          binLocation:
            type: object
            nullable: true
            additionalProperties: true
            description: See #/components/schemas/IdNamePair
          quantity:
            type: number
            nullable: true
    productInventoryItems:
      type: object
      description: Map of productId -> inventory items.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/InventoryItemReference'
    quantityMap:
      type: object
      description: Map of inventoryItemId -> quantity.
      additionalProperties:
        type: number
        nullable: true
    reasonCodes:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    transactionTypesDebit:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    destinations:
      type: array
      items:
        type: object
        additionalProperties: true
    sources:
      type: array
      items:
        type: object
        additionalProperties: true
    warehouseBinLocations:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    users:
      type: array
      items:
        type: object
        additionalProperties: true
    currentUserId:
      type: string
      nullable: true

SaveTransactionSuccessResponse:
  type: object
  description: Success response of the saveAdjustment/saveDebit/saveCredit transaction endpoints.
  required: [success]
  properties:
    success:
      type: boolean
    message:
      type: string
    productId:
      type: string
      nullable: true

TransactionEditContextResponse:
  type: object
  description: Response of GET /api/inventory/transactions/{id}.
  required: [transaction]
  properties:
    transaction:
      type: object
      additionalProperties: true
    inventoryItemsMap:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/InventoryItemReference'
    transactionTypeList:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    locationInstanceList:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    warehouseInstance:
      $ref: '#/components/schemas/IdNamePair'

TransactionNotFoundResponse:
  type: object
  description: 404 body of getTransaction/showTransaction (`{error}` rather than the shared ErrorResponse).
  required: [error]
  properties:
    error:
      type: string

SaveTransactionHeaderResponse:
  type: object
  description: Response of POST /api/inventory/saveTransaction.
  required: [success]
  properties:
    success:
      type: boolean
    message:
      type: string
      nullable: true
    errors:
      type: array
      items:
        type: string
    id:
      type: string
      nullable: true

ShowTransactionResponse:
  type: object
  description: Response of GET /api/inventory/showTransaction/{id}.
  required: [transaction]
  properties:
    isSuperuser:
      type: boolean
    transaction:
      type: object
      additionalProperties: true

ListTransactionsResponse:
  type: object
  description: Response of GET /api/inventory/listTransactions.
  required: [transactions]
  properties:
    warehouseName:
      type: string
      nullable: true
    transactionCount:
      type: integer
    transactionTypeSelected:
      type: string
      nullable: true
    transactionTypes:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'
    isSuperuser:
      type: boolean
    max:
      type: integer
    offset:
      type: integer
    transactions:
      type: array
      items:
        type: object
        additionalProperties: true

ListBinLocationsQuantityResponse:
  type: object
  description: Response of GET /api/inventory/listBinLocations.
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          productCode:
            type: string
            nullable: true
          productName:
            type: string
            nullable: true
          binLocation:
            type: string
            nullable: true
          lotNumber:
            type: string
            nullable: true
          expirationDate:
            type: string
            nullable: true
          quantity:
            type: number
            nullable: true

ShowProductsResponse:
  type: object
  description: Response of GET /api/inventory/showProducts.
  required: [categories]
  properties:
    categories:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            nullable: true
          products:
            type: array
            items:
              $ref: '#/components/schemas/ProductSummary'

UploadInventoryResponse:
  type: object
  description: Response of POST /api/inventory/uploadInventory.
  required: [inventoryList]
  properties:
    inventoryList:
      type: array
      items:
        type: array
        items:
          type: object
          properties:
            key:
              type: string
              nullable: true
            value:
              type: string
              nullable: true

ReorderReportResponse:
  type: object
  description: Response of GET /api/facilities/{facilityId}/inventories/reorderReport.
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true

ExpirationHistoryReportResponse:
  type: object
  description: Response of GET /api/inventories/expirationHistoryReport.
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true
    totalCount:
      type: integer
      nullable: true
    totalQuantityLostToExpiry:
      type: number
      nullable: true
    totalValueLostToExpiry:
      type: number
      nullable: true

InventoryLevelListResponse:
  type: object
  description: Response of GET /api/facilities/{facilityId}/inventory-levels (default Grails JSON of InventoryLevel domain objects).
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true

InventoryLevelSearchResponse:
  type: object
  description: Response of GET /api/inventoryLevels/search.
  required: [inventoryLevels, totalCount, locations]
  properties:
    inventoryLevels:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          status:
            type: string
            nullable: true
          product:
            $ref: '#/components/schemas/ProductSummary'
          inventory:
            type: string
            nullable: true
          minQuantity:
            type: number
            nullable: true
          reorderQuantity:
            type: number
            nullable: true
          maxQuantity:
            type: number
            nullable: true
          dateCreated:
            type: string
            nullable: true
    totalCount:
      type: integer
    locations:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'

InventoryLevelDetailed:
  type: object
  description: Detailed inventory level map (InventoryLevelApiController.toDetailedMap).
  properties:
    id:
      type: string
    version:
      type: integer
    status:
      type: string
      nullable: true
    product:
      type: object
      additionalProperties: true
    inventory:
      $ref: '#/components/schemas/IdNamePair'
    internalLocation:
      type: object
      nullable: true
      additionalProperties: true
      description: See #/components/schemas/IdNamePair
    preferredBinLocation:
      type: object
      nullable: true
      additionalProperties: true
      description: See #/components/schemas/IdNamePair
    replenishmentLocation:
      type: object
      nullable: true
      additionalProperties: true
      description: See #/components/schemas/IdNamePair
    abcClass:
      type: string
      nullable: true
    comments:
      type: string
      nullable: true
    minQuantity:
      type: number
      nullable: true
    reorderQuantity:
      type: number
      nullable: true
    maxQuantity:
      type: number
      nullable: true
    expectedLeadTimeDays:
      type: number
      nullable: true
    replenishmentPeriodDays:
      type: number
      nullable: true
    forecastQuantity:
      type: number
      nullable: true
    forecastPeriodDays:
      type: number
      nullable: true
    dateCreated:
      type: string
      nullable: true
    lastUpdated:
      type: string
      nullable: true

InventoryLevelDetailsResponse:
  type: object
  description: Response of GET /api/inventoryLevels/{id}/details.
  required: [inventoryLevel]
  properties:
    inventoryLevel:
      $ref: '#/components/schemas/InventoryLevelDetailed'

InventoryLevelNotFoundResponse:
  type: object
  description: 404 body `{errorMessage}` used by inventory level and stock card endpoints (not the shared ErrorResponse).
  required: [errorMessage]
  properties:
    errorMessage:
      type: string

InventoryLevelFormContextResponse:
  type: object
  description: Response of GET /api/inventoryLevels/formContext and /api/inventoryLevels/{id}/formContext.
  required: [statusOptions, binLocations]
  properties:
    inventoryLevel:
      type: object
      nullable: true
      additionalProperties: true
      description: See #/components/schemas/InventoryLevelDetailed
    product:
      type: object
      nullable: true
      additionalProperties: true
    location:
      type: object
      nullable: true
      additionalProperties: true
      description: See #/components/schemas/IdNamePair
    statusOptions:
      type: array
      items:
        type: string
    binLocations:
      type: array
      items:
        $ref: '#/components/schemas/IdNamePair'

InventoryLevelMutationSuccessResponse:
  type: object
  description: Success body of inventory level save/update/delete.
  required: [success]
  properties:
    success:
      type: boolean
    message:
      type: string
    id:
      type: string
      nullable: true
    productId:
      type: string
      nullable: true

InventoryLevelMutationErrorResponse:
  type: object
  description: Error body (400/404) of inventory level save/update/delete (`{success:false, errorMessages}`).
  required: [success]
  properties:
    success:
      type: boolean
    errorMessages:
      type: array
      items:
        type: string
    productId:
      type: string
      nullable: true

InventoryTransactionsSummaryResponse:
  type: object
  description: Response of GET /api/reports/inventory-transactions-summary.
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true
    totalCount:
      type: integer
      nullable: true

BinLocationListResponse:
  type: object
  description: Response of GET /api/binLocations (default Grails JSON of Location domain objects).
  required: [data]
  properties:
    data:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true

BinLocationReadResponse:
  type: object
  description: Response of GET /api/binLocations/{id} (default Grails JSON of a Location domain object).
  required: [data]
  properties:
    data:
      type: object
      additionalProperties: true

InternalLocationSummary:
  type: object
  description: Internal location entry `{id, name, zoneId, zoneName}`.
  properties:
    id:
      type: string
    name:
      type: string
      nullable: true
    zoneId:
      type: string
      nullable: true
    zoneName:
      type: string
      nullable: true

InternalLocationListResponse:
  type: object
  description: Response of GET /api/internalLocations and /api/internalLocations/receiving.
  required: [data]
  properties:
    data:
      type: array
      nullable: true
      items:
        $ref: '#/components/schemas/InternalLocationSummary'

InternalLocationSearchResponse:
  type: object
  description: Response of GET /api/internalLocations/search (data is default Grails JSON of Location domain objects).
  required: [data]
  properties:
    data:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true
    totalCount:
      type: integer
      nullable: true

InternalLocationReadResponse:
  type: object
  description: Response of GET /api/internalLocations/{id} (default Grails JSON of a Location domain object; data is null when the id is unknown).
  required: [data]
  properties:
    data:
      type: object
      nullable: true
      additionalProperties: true

CycleCountEnvelope:
  type: object
  description: Standard JsonSerializer envelope `{data, status, count}` used by CycleCountApiController.
  required: [data, status]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true
    status:
      type: integer
    count:
      type: integer

CycleCountPaginatedEnvelope:
  type: object
  description: JsonSerializer envelope for paginated lists `{data, status, count, totalCount}`.
  required: [data, status]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true
    status:
      type: integer
    count:
      type: integer
    totalCount:
      type: integer
      nullable: true

CycleCountObjectEnvelope:
  type: object
  description: JsonSerializer envelope for a single object `{data, status}`.
  required: [status]
  properties:
    data:
      type: object
      nullable: true
      additionalProperties: true
    status:
      type: integer

CycleCountReportEnvelope:
  type: object
  description: JsonSerializer envelope of the cycle-count report endpoints `{data, status, count, totalCount, max, offset}`.
  required: [data, status]
  properties:
    data:
      type: array
      items:
        type: object
        additionalProperties: true
    status:
      type: integer
    count:
      type: integer
    totalCount:
      type: integer
      nullable: true
    max:
      type: integer
      nullable: true
    offset:
      type: integer
      nullable: true

CycleCountCandidatesResponse:
  type: object
  description: Response of GET /api/facilities/{facilityId}/cycle-counts/candidates.
  required: [data, status]
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          product:
            $ref: '#/components/schemas/ProductSummary'
          dateLastCount:
            type: string
            nullable: true
          dateNextCount:
            type: string
            nullable: true
          daysUntilNextCount:
            type: integer
            nullable: true
          category:
            type: object
            nullable: true
            additionalProperties: true
            description: See #/components/schemas/IdNamePair
          internalLocations:
            type: string
            nullable: true
          tags:
            type: array
            items:
              type: object
              additionalProperties: true
          productCatalogs:
            type: array
            items:
              type: object
              additionalProperties: true
          abcClass:
            type: string
            nullable: true
          quantityOnHand:
            type: number
            nullable: true
          quantityAllocated:
            type: number
            nullable: true
          cycleCountRequest:
            type: object
            nullable: true
            additionalProperties: true
          status:
            type: string
            nullable: true
          inventoryItemCount:
            type: integer
            nullable: true
          negativeItemCount:
            type: integer
            nullable: true
          hasStockOnHandOrNegativeStock:
            type: boolean
            nullable: true
          sortOrder:
            type: integer
            nullable: true
    status:
      type: integer
    count:
      type: integer
    totalCount:
      type: integer
      nullable: true

CycleCountItemsUploadResponse:
  type: object
  description: Response of the cycle count items upload endpoints `{data, status, count, errors}`.
  required: [status]
  properties:
    data:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true
    status:
      type: integer
    count:
      type: integer
    errors:
      type: array
      items:
        type: string

CycleCountRequestBatchInput:
  type: object
  description: Request body of POST /api/facilities/{facilityId}/cycle-counts/requests/batch.
  required: [requests]
  properties:
    requests:
      type: array
      items:
        type: object
        properties:
          facility:
            type: string
            description: Facility location id.
          product:
            type: string
            description: Product id.
          blindCount:
            type: boolean
        additionalProperties: true

CycleCountUpdateRequestBatchInput:
  type: object
  description: Request body of PATCH /api/facilities/{facilityId}/cycle-counts/requests/batch.
  required: [requests]
  properties:
    requests:
      type: array
      items:
        type: object
        additionalProperties: true

CycleCountStartBatchInput:
  type: object
  description: Request body of the cycle count start / recount-start batch endpoints.
  required: [requests]
  properties:
    requests:
      type: array
      items:
        type: object
        additionalProperties: true

CycleCountSubmitCountInput:
  type: object
  description: Request body of POST .../cycle-counts/{cycleCountId}/count and /recount.
  additionalProperties: true
  properties:
    refreshQuantityOnHand:
      type: boolean
    failOnOutdatedQuantity:
      type: boolean
    requireRecountOnDiscrepancy:
      type: boolean

CycleCountItemInput:
  type: object
  description: Request body for creating/updating a cycle count item.
  additionalProperties: true
  properties:
    cycleCount:
      type: string
    product:
      type: string
    inventoryItem:
      type: string
    binLocation:
