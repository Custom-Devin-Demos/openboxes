# Reason code API schemas (ReasonCodeApiController).

ReasonCode:
  type: object
  description: |
    Localized reason code (ReasonCodeCommand.toJson()). `id` is the
    ReasonCode enum name; `name` is the localized label (falls back to null
    when no message is defined for the code).
  required: [id, sortOrder]
  properties:
    id:
      type: string
      example: STOCKOUT
    name:
      type: string
      nullable: true
      example: Stock-out
    sortOrder:
      type: integer
      nullable: true
