# Schemas for the admin API (AdminApiController). See paths/admin.yaml.

AdminMessageResponse:
  type: object
  description: Simple message envelope returned by admin mutation endpoints.
  required:
    - data
  properties:
    data:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Operation completed

AdminController:
  type: object
  required:
    - name
    - fullName
    - logicalPropertyName
  properties:
    name:
      type: string
      example: Admin
    fullName:
      type: string
      example: org.pih.warehouse.admin.AdminController
    logicalPropertyName:
      type: string
      example: admin

AdminPlugin:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      example: i18n
    version:
      type: string
      nullable: true
      example: 6.2.3

AdminStatus:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - appVersion
        - grailsVersion
        - jvmVersion
        - controllerCount
        - domainCount
        - serviceCount
        - tagLibCount
        - plugins
        - controllers
      properties:
        appVersion:
          type: string
          nullable: true
        grailsVersion:
          type: string
          nullable: true
        jvmVersion:
          type: string
        controllerCount:
          type: integer
        domainCount:
          type: integer
        serviceCount:
          type: integer
        tagLibCount:
          type: integer
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/AdminPlugin'
        controllers:
          type: array
          items:
            type: object
            required:
              - name
              - logicalPropertyName
            properties:
              name:
                type: string
              logicalPropertyName:
                type: string

AdminCache:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - hibernateConfig
        - cacheStatistics
        - secondLevelCacheStatistics
        - queryCacheStatistics
        - entityCacheStatistics
      properties:
        hibernateConfig:
          type: string
        cacheStatistics:
          type: string
        secondLevelCacheStatistics:
          type: array
          items:
            type: object
        queryCacheStatistics:
          type: array
          items:
            type: object
        entityCacheStatistics:
          type: array
          items:
            type: object
            properties:
              entityName:
                type: string
              loadCount:
                type: integer
              deleteCount:
                type: integer
              fetchCount:
                type: integer
              insertCount:
                type: integer
              updateCount:
                type: integer
              optimisticFailureCount:
                type: integer

AdminSettings:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      description: |
        Instance settings dump: environment, versions, locales, masked mail
        and config properties, system properties, printers and scheduler
        metadata. Password-like config values are masked.
      required:
        - environment
        - grailsVersion
        - currentDate
        - supportedLocales
        - configProperties
        - systemProperties
        - printers
      properties:
        environment:
          type: string
          example: DEVELOPMENT
        appVersion:
          type: string
          nullable: true
        showUpgradeLink:
          type: boolean
        buildNumber:
          type: string
          nullable: true
        buildDate:
          description: |
            Build timestamp; serializes as a string or as an
            `{empty, present}` Optional-like object when unset.
        branchName:
          type: string
          nullable: true
        grailsVersion:
          type: string
        currentDate:
          type: string
        supportedLocales:
          type: array
          items:
            type: object
            required:
              - code
            properties:
              code:
                type: string
              displayName:
                type: string
                nullable: true
              displayLanguageInUserLocale:
                type: string
                nullable: true
              current:
                type: boolean
        showCustomizeButton:
          type: boolean
        defaultCharset:
          type: string
        mailSettings:
          type: array
          items:
            $ref: '#/components/schemas/AdminKeyValue'
        externalConfigFile:
          type: string
          nullable: true
        configProperties:
          type: array
          items:
            $ref: '#/components/schemas/AdminKeyValue'
        systemProperties:
          type: array
          items:
            $ref: '#/components/schemas/AdminKeyValue'
        printers:
          type: array
          items:
            type: object
        schedulerName:
          type: string
        schedulerInstanceId:
          type: string
        schedulerMetaData:
          type: string
        caches:
          type: array
          items: {}

AdminKeyValue:
  type: object
  properties:
    key:
      type: string
      nullable: true
    value:
      type: string
      nullable: true

AdminUpgradeStatus:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - downloadCancelled
        - downloadDone
      properties:
        remoteWebArchiveUrl:
          type: string
          nullable: true
        remoteFileSize:
          type: integer
          nullable: true
        localFileSize:
          type: integer
          nullable: true
        localWebArchivePath:
          type: string
          nullable: true
        localWebArchive:
          type: string
          nullable: true
          description: Absolute path of the downloaded WAR file.
        downloadCancelled:
          type: boolean
        downloadDone:
          type: boolean

AdminMailForm:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - subject
      properties:
        to:
          type: string
          nullable: true
          description: Current session user's email.
        from:
          type: string
          nullable: true
          description: Configured grails.mail.from address.
        subject:
          type: string
          example: Test email
