# Shared parameters merged into components.parameters of the bundled document.
# Reference from fragments as: $ref: '#/components/parameters/<Name>'

maxParam:
  name: max
  in: query
  description: Maximum number of results to return (page size).
  required: false
  schema:
    type: integer
    minimum: 0

offsetParam:
  name: offset
  in: query
  description: Number of results to skip (page offset).
  required: false
  schema:
    type: integer
    minimum: 0

sortParam:
  name: sort
  in: query
  description: Property name to sort by.
  required: false
  schema:
    type: string

orderParam:
  name: order
  in: query
  description: Sort direction.
  required: false
  schema:
    type: string
    enum: [asc, desc]
